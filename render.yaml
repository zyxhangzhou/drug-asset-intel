# Render Blueprint: one Docker web service serving the API and the built frontend.
services:
  - type: web
    name: drug-asset-intel
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # Shared site password; set it in the Render dashboard, never in the repo.
      - key: INTEL_ACCESS_PASSWORD
        sync: false
