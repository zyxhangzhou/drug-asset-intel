[clinical]
design = "BOND-003 Cohort C（NCT04452591）：国际多中心、单臂、开放标签 3 期，41 个中心，入组高危 BCG 无应答、伴原位癌（CIS）±乳头状 Ta/T1 的 NMIBC；膀胱内灌注 1×10^12 病毒颗粒每周 1 次、6 周诱导后维持，3 个月未缓解可再诱导；原文：\"BOND-003 Cohort C is a single-arm, international, phase 3 study done in 41 centres\"、\"115 patients were enrolled in the study and 112 received cretostimogene\"（MAN-CGON-3）。"
comparability = "单臂试验，无对照组；与已上市药只能跨试验比较，人群与终点定义可能不同。10-K 列出的同适应症数据：pembrolizumab \"39 of 96 patients, or 41%, had a CR at 3 months\"；nadofaragene \"51% of patients achieved a CR\"；TAR-200 \"The approval was based on a Phase 2b clinical trial showing 82% CR and 51% of patients with a CR had a DOR ≥ 12 months\"（MAN-CGON-1）。cretostimogene 的 CR 率高于 pembrolizumab、nadofaragene，但低于 TAR-200；差异化主要在安全性与缓解持久性。公司自称 \"potentially best-in-disease data\"（SEC-0001193125-26-336918），属公司表述。"
result = "任意时间 CR 75%（83/110，95% CI 66.3–83.2），中位随访 25.8 个月；原文：\"after a median follow-up of 25·8 months (IQR 22·1-33·1), complete response at any time was observed in 83 (75% [95% CI 66·3-83·2]) of 110 patients\"（MAN-CGON-3）。缓解持久性：\"12- and 24-month duration of response (DOR) rates of 64.2% and 60.1%, respectively\"（SEC-0001193125-26-336918）。安全性：\"there were no grade 3 or 4 treatment-related adverse events and no treatment-related discontinuations or deaths\"（MAN-CGON-3）。"
limitation = "单臂、无对照，资助方为公司：\"FUNDING: CG Oncology.\"（MAN-CGON-3）。摘要未写预设成功阈值，无法判断是否「达到」预设终点，只能看效应大小。CR 率低于 J&J 已上市的 TAR-200（跨试验）。唯一随机 3 期 PIVOT-006（中危 NMIBC）尚未读出。知识产权：\"Currently, we do not have composition of matter patents covering cretostimogene.\"（MAN-CGON-1）。"
sources = ["MAN-CGON-3", "MAN-CGON-1", "SEC-0001193125-26-336918", "CTG-NCT04452591"]

