reason = "单臂 3 期，唯一主要终点为任意时间中心确认 CR，原文：\"The primary endpoint was centrally confirmed complete response at any time\"、\"complete response at any time was observed in 83 (75% [95% CI 66·3-83·2]) of 110 patients\"（MAN-CGON-3）。BCG 无应答伴 CIS 的 NMIBC 属单臂数据可作注册依据的领域，原文：\"a single-arm clinical trial in patients with BCG-unresponsive NMIBC that assess CR rate as the primary endpoint, taking DOR into account, may be appropriate for full approval\"（MAN-CGON-1）。按 §3.3 得 3 分；无随机对照，与标准治疗只有跨试验比较，最高 3 分。摘要未写预设成功阈值。"
