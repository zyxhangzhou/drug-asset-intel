[rights]
status = "partial"
note = "最新 10-Q：公司把 cretostimogene 的亚洲区域权益授权给两家公司，其余（含美国、欧洲）在公司手中。Lepu：\"granted to Lepu an exclusive license to develop, manufacture and commercialize cretostimogene and/or n-Dodecyl-beta-Maltoside (DDM) to treat and/or prevent cancer in mainland China, including Hong Kong and Macau (the Lepu Territory)\"。Kissei：\"granted to Kissei an exclusive license to certain intellectual property rights in Bangladesh, Bhutan, Brunei, Cambodia, India, Indonesia, Japan, South Korea, Laos, Malaysia, Myanmar, Nepal, Pakistan, Palau, Philippines, Singapore, Sri Lanka, Taiwan, Thailand and Vietnam (the Kissei Territory)\"（SEC-0001193125-26-336918）。对收购方的负担：一是公司须向 Kissei 支付区域外销售分成，\"We have also agreed to pay Kissei a royalty on net sales of Licensed Product outside the Kissei Territory and outside the Lepu Territory, including on any U.S. sales, in a low-single digit percentage\"；二是全球开发费用分担，\"Kissei is responsible for a low-double digit percentage and the Company is responsible for a high-double digit percentage of the cost of development activities that cannot be attributed solely to the Kissei Territory\"；三是全球竞品限制，\"the Company is prohibited from commercializing certain competing products worldwide\"（SEC-0001193125-26-336918）。Kissei 安排在会计上属 ASC 808 合作，但无区域外共同商业化或利润分成，故按 partial 处理，复核人可判断是否属共同开发。无引进许可：10-K 称公司是从他方购买的知识产权（\"the entity from which we purchased the intellectual property rights to cretostimogene\"，MAN-CGON-1）；原转让方 ANI 的 5% 特许权使用费诉讼公司一审胜诉，\"the Company will not owe ANI a future royalty of 5 % on commercial sales of cretostimogene\"，但 \"The Company will continue to vigorously defend any appeals brought by ANI.\"（SEC-0001193125-26-336918）。已读 10-K Business「License and Collaboration Agreements」段（MAN-CGON-1）：Kissei 与 Lepu 条款与 10-Q 一致，未见选择权、优先谈判权或控制权变更条款；Lepu 协议终止时权益回归公司，\"all rights and licenses granted to Lepu to develop and commercialize cretostimogene and DDM under the agreement will terminate\"。债务：Biovire 无担保票据，\"outstanding principal balance of $ 3.0 million\"，\"due and payable on February 28, 2028\"（SEC-0001193125-26-336918）。"
sources = ["SEC-0001193125-26-336918", "MAN-CGON-1"]
