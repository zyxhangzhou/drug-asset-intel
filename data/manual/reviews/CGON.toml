match_note = "Pfizer 第 2 治疗领域（肿瘤）画像点名「泌尿」肿瘤；cretostimogene 是膀胱内给药的溶瘤免疫疗法，适应症为高危 BCG 无应答 NMIBC（膀胱癌），原文：\"an investigational oncolytic immunotherapy with a dual mechanism of action\"、\"as a potential backbone therapy in a broad range of patients afflicted with bladder cancer\"（SEC-0001193125-26-336918）。匹配只在适应症一端：画像列出的技术类型（ADC、双抗、靶向小分子、放射性药物）不含溶瘤病毒。组合冲突：10-K 竞争段把 Pfizer 列为 NMIBC 开发者，\"there are numerous companies that have commercialized or are developing treatments for NMIBC, including ... Pfizer, Inc.\"（MAN-CGON-1），但未写其机制；本复核未打开 Pfizer 自身文件，未核查组合冲突（是否有同机制 NMIBC 资产）。10-K 中同适应症已上市竞品为 Merck（pembrolizumab）、Ferring（nadofaragene，非复制型腺病毒）、J&J（TAR-200）、ImmunityBio，均非 Pfizer。"
thesis = [
  "Pfizer 需要「ADC、双特异抗体、靶向小分子或放射性药物，覆盖乳腺、肺癌、泌尿和血液肿瘤」；CG Oncology 的 cretostimogene grenadenorepvec（膀胱内给药溶瘤腺病毒免疫疗法，高危 BCG 无应答 NMIBC 伴原位癌，单臂 3 期完成、BLA 滚动提交中）对应这一需求中的「泌尿」肿瘤，因为它是膀胱癌保膀胱治疗的后期资产；但画像列出的技术类型不含溶瘤病毒，且 10-K 把 Pfizer 列为 NMIBC 开发者（机制未写，未核查组合冲突）。",
  "证据是单臂 3 期 BOND-003 Cohort C（Lancet Oncology 2026）：任意时间完全缓解 75%（83/110），12、24 个月 DOR 率 64.2%、60.1%，无 3/4 级治疗相关不良事件；与 pembrolizumab（41%）、TAR-200（82%）等只能跨试验比较；下一事件是该适应症 BLA 提交完成（2026 年第四季度，明确披露）；主要障碍是成本：EV 约 46 亿美元（市值约 56.7 亿美元，现金及投资 10.3 亿美元），另有 Kissei / Lepu 亚洲区域授权与付给 Kissei 的美国销售低个位数特许权使用费。",
]
thesis_sources = ["PFE-1", "PFE-3", "SEC-0001193125-26-336918", "MAN-CGON-1", "MAN-CGON-2", "MAN-CGON-3", "CTG-NCT04452591", "NASDAQ-CGON-2026-10-28"]

