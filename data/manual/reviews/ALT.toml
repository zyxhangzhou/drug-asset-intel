[clinical]
design = "IMPACT 2b 期（NCT05989711），随机、安慰剂对照、双盲，212 例活检确诊 MASH 且纤维化 F2/F3 患者，1:2:2 随机至 pemvidutide 1.2 mg、1.8 mg 或安慰剂，每周皮下注射 48 周，主要终点在第 24 周评估。原文：\"The randomized, placebo-controlled, double-blind IMPACT Phase 2b trial ( NCT05989711 ) enrolled 212 participants with biopsy-confirmed\"（MAN-ALT-3）；\"endpoints, measured at 24 weeks, were MASH resolution without worsening of fibrosis, or fibrosis improvement without worsening of MASH.\"（MAN-ALT-3）"
comparability = "只与安慰剂比较，无与标准治疗（如已获批 MASH 药物）的头对头数据；与其他 MASH 资产只能跨试验比较，人群与终点定义可能不同。"
result = "24 周 ITT：MASH 缓解且纤维化不恶化 59.1%（1.2 mg）/ 52.1%（1.8 mg）对安慰剂 19.1%，原文：\"59.1% and 52.1%, for pemvidutide 1.2 mg and 1.8 mg, respectively versus 19.1% for placebo (p< 0.0001 both doses)\"（MAN-ALT-2）；24 周体重下降 5.0% / 6.2% 对 1.0%（\"mean weight loss in pemvidutide-treated participants was 5.0% and 6.2%\"，MAN-ALT-2）。48 周非侵入性纤维化指标改善：\"ELF: 1.2 mg and 1.8 mg doses achieved a mean reduction from\"基线 -0.49 / -0.58 对 +0.16（p<0.0001，MAN-ALT-3）。"
limitation = "纤维化改善主要终点未达统计学显著，原文：\"compared with 25.9% for placebo (differences not statistically significant)\"（MAN-ALT-2）；48 周数据为非侵入性指标（ELF、LSM），非组织学；仅为公司新闻稿顶线数据，未见同行评议全文（待核实）。"
sources = ["MAN-ALT-2", "MAN-ALT-3", "CTG-NCT05989711"]

