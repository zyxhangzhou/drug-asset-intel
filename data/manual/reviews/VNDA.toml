[clinical]
design = "3 期 Study 3601（VP-VLY-686-3601，NCT07446439）：随机、安慰剂对照，tradipitant 对比安慰剂，受试者接受单次 1 mg semaglutide 激发；原文：\"a Phase III randomized, placebo-controlled study\"、\"Participants received a single 1 mg dose of semaglutide without the gradual titration used in clinical practice\"（MAN-VNDA-4）。CT.gov 主要终点：\"Proportion of participants with at least 1 vomiting episode per week in the tradipitant group compared to the placebo group\"（CTG-NCT07446439）。前置 2 期（VP-VLY-686-2601，NCT06804603）以 Wegovy 1 mg 激发：\"pre-treated patients with either NEREUS TM or placebo before administering a 1 mg injection of Wegovy\"（MAN-VNDA-1）。"
comparability = "只有安慰剂对照。GLP-1 相关呕吐没有已批准药物，无标准治疗可作直接对比；与其他止吐药（如其他 NK-1 拮抗剂、5-HT3 拮抗剂）的任何比较都是跨试验比较，人群与终点定义可能不同。"
result = "主要终点：任何呕吐 43.0%（61/142）对 58.5%（96/164），p=0.006（按中心校正），相对降低 27%；关键次要终点（任何呕吐且最重恶心 ≥3）33.1% 对 50.6%，p=0.002；安全性无新信号。原文：\"Vomiting occurred in 43.0% of NEREUS™-treated participants (61/142) compared with 58.5% on placebo (96/164) (p=0.006, adjusted for site), a 27% relative reduction\"、\"occurred in 33.1% of participants on NEREUS™ (47/142) versus 50.6% on placebo (83/164) (p=0.002, adjusted for site)\"、\"No new safety signals were observed\"（MAN-VNDA-4）。2 期：\"showed a 50% relative reduction in symptoms\"（MAN-VNDA-1）。"
limitation = "激发设计不同于临床滴定用法，公司以暴露-效应分析外推：\"supporting extrapolation of the effect to real-world dosing of semaglutide\"（MAN-VNDA-4），外推是否被 FDA 接受未知。频繁/极端呕吐的大幅降低（60%、81%）为事后分析：\"These analyses are post hoc\"（MAN-VNDA-4）。数据只来自公司新闻稿，无同行评议全文；未证明能减少 GLP-1 停药。CT.gov 记录仍为 RECRUITING、预计入组 280，与新闻稿分析人数 306 不一致（记录未更新）。"
sources = ["MAN-VNDA-4", "MAN-VNDA-1", "CTG-NCT07446439", "CTG-NCT06804603"]

