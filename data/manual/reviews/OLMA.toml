[rights]
status = "restricted"
note = "公司拥有全球权益，原文 \"We own full worldwide development and commercialization rights to both palazestrant and OP-3136\"（MAN-OLMA-1）；但 2024 Novartis Agreement 给予 Novartis 优先谈判权，覆盖任何区域的许可与资产转让，原文 \"The Company granted Novartis a right of first negotiation with respect to (a) the grant to any person or entity any right, license or sublicense to exploit palazestrant, in any field or territory\"（SEC-0001193125-26-342383；10-K 同段为 \"We granted Novartis a right of first negotiation\"，MAN-OLMA-1），并在公司主动寻求出售时享有排他尽调与谈判期（\"Novartis will have the exclusive right (but no obligation) to conduct due diligence\"，MAN-OLMA-1）；与 Novartis 以外第三方完成交易须偿付 \"the proportion of approximately $ 275 million that is represented by the number of units of ribociclib actually supplied\"（SEC-0001193125-26-342383）。上述权利持续至 \"the date that is 120 days after filing of the New Drug Application for the Olema Combination\" 等较早者（MAN-OLMA-1）。Pfizer 两项协议为非排他临床供应协议，原文 \"non-exclusive, royalty-free license\"（MAN-OLMA-1），不影响权益。Aurigene 许可（里程碑与特许权使用费）只覆盖 OP-3136，原文 \"Aurigene has provided to us an exclusive license to Aurigene's rights to patents and applications related to OP-3136\"（MAN-OLMA-1），palazestrant 未见对外许可方付费义务。"
sources = ["MAN-OLMA-1", "SEC-0001193125-26-342383"]
