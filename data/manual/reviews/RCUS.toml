reason = "现有疗效数据全部来自 1/1b 期单臂 ARC-20，公司自述其定位为概念验证：\"ARC-20 is designed to generate safety and proof-of-concept clinical data to support and inform our registrational studies for casdatifan\"（MAN-RCUS-1）。后线单药信号阳性：\"median overall survival was 35 months, median PFS was 13 months and cORR was 36%\"（MAN-RCUS-3）。与 belzutifan 只有跨试验比较（\"relative to data reported for belzutifan in a similar patient population\"，MAN-RCUS-1），随机 3 期 PEAK-1 尚未读出，故按「早期单臂阳性信号」给 2 分。"
