match_note = "casdatifan 是口服小分子 HIF-2α 抑制剂（靶向小分子），适应症为透明细胞肾细胞癌（ccRCC，属泌尿系统肿瘤；「肾癌归入泌尿」是我们的归类判断），对应画像中的「靶向小分子」与「泌尿」两项；原文：\"Casdatifan is our oral, small-molecule inhibitor of HIF-2α\"（MAN-RCUS-1）。组合冲突仅按 10-K 竞争段（只列 HIF-2α 同机制药物）核查：\"Merck received approval for belzutifan in Von Hippel-Lindau disease in 2021, advanced renal cell carcinoma in 2023\"、\"Other pharmaceutical companies, including Novartis and NiKang Therapeutics, Inc., have small-molecule HIF-2α inhibitors in development\"（MAN-RCUS-1），其中无 Pfizer；Pfizer 其他 RCC 资产及早期管线未核查组合冲突。Merck（belzutifan 同机制同适应症）与 Novartis（在研 HIF-2α）因此不选。"
thesis = [
  "Pfizer 需要「靶向小分子…覆盖…泌尿…肿瘤」；Arcus 的 casdatifan（口服小分子 HIF-2α 抑制剂，转移性透明细胞肾细胞癌，3 期 PEAK-1 入组中）对应这一需求，因为它是靶向泌尿系统肿瘤的小分子，且 Pfizer 不在 10-K 列出的 HIF-2α 同机制竞品中。",
  "证据是 1/1b 期单臂 ARC-20：后线单药 n=121 中位 PFS 13 个月、cORR 36%、中位 OS 35 个月，二线联合卡博替尼 n=43 中位 PFS 14.5 个月（与 belzutifan 只有跨试验比较）；下一事件是 PEAK-1（卡博替尼联合，IO 经治 ccRCC）PFS 主要终点读出（CT.gov 预计主要完成 2028-04，估算）；主要障碍是权益与股东结构：日本及部分亚洲地区（不含中国）权益已授予 Taiho，Gilead 持有约 24.7% 股份，另有 Hercules 定期贷款已提取 1 亿美元。",
]
