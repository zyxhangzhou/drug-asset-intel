[clinical]
design = "ARC-20：1/1b 期单臂平台研究（NCT05536141），多个队列覆盖一线、二线与后线 ccRCC；数据截止 2026-09-04，原文：\"data cutoff date of September 4, 2026\"（MAN-RCUS-3）。后线单药 4 个队列合并 n=121：\"Casdatifan monotherapy (n=121)\"；二线联合卡博替尼 n=43：\"with 21.3 months of median follow up (n=43)\"（MAN-RCUS-3）。"
comparability = "无随机对照、无与标准治疗的直接比较。公司把后线单药数据与 belzutifan 已发表数据对比：\"relative to data reported for belzutifan in a similar patient population\"（MAN-RCUS-1）——属跨试验比较，人群与终点定义可能不同。"
result = "后线单药（中位随访 28 个月）：\"median overall survival was 35 months, median PFS was 13 months and cORR was 36%\"。二线联合卡博替尼：\"median PFS was 14.5 months, 18-month landmark overall survival was 77%, cORR was 44% and primary progression was 5%\"。一线联合 zimberelimab（n=30，中位随访 11.5 个月）：6/12 个月无进展生存率 86%/69%，\"the rate of primary progression (progression at or before the first scan) was 6.7%\"（均 MAN-RCUS-3）。"
limitation = "全部为单臂、公司 8-K 披露的中期数据，PFS/ORR 非随机对照结果。AstraZeneca 运营的一线 casdatifan+volrustomig 1b/3 期因免疫相关不良事件暂停入组：\"A decision was made to temporarily pause recruitment, after observing certain immune-mediated AEs\"（MAN-RCUS-1）。一线 IO/IO 三联队列中位随访仅 3 个月（MAN-RCUS-3）。"
sources = ["MAN-RCUS-1", "MAN-RCUS-3", "CTG-NCT05536141"]

