note = "10-K 原文：\"We currently own all of the commercial rights to casdatifan, with the exception of rights in Japan and certain other Asian countries (excluding China) which were optioned from us by Taiho Pharmaceutical Co., Ltd\"（MAN-RCUS-1）；最新 10-Q 同样：\"Taiho has development and commercial rights in Japan and other countries in Asia, excluding China, for casdatifan\"（SEC-0001724521-26-000044）。已授出区域 = Taiho Territory（日本及部分亚洲国家，不含中国）；Taiho 向 Arcus 支付里程碑及 \"royalties on net sales in Taiho’s territories ranging from high single digits to mid-teens\"（MAN-RCUS-1）。Gilead 对 HIF-2α 项目的选择权已失效：\"Gilead's time-limited exclusive option rights to our HIF-2α program, which includes casdatifan, expired\"（MAN-RCUS-1）。非引进资产：10-K 引进许可只列 \"We have in-licensed rights to anti-PD-1 and CD39 antibodies from WuXi Biologics, and to domvanalimab from Abmuno\"（MAN-RCUS-1），未见欠许可方的特许权使用费。收购障碍（非权益限制）：\"Gilead held approximately 24.7 % of our outstanding common stock\"；债务：\"$100 million has been drawn\"（Hercules 定期贷款，SEC-0001724521-26-000044）。"
sources = ["MAN-RCUS-1", "SEC-0001724521-26-000044"]
