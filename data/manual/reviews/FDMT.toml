match_note = "4D-710 是雾化吸入的 AAV 基因疗法（A101 载体递送 CFTR 转基因），治疗遗传病囊性纤维化（CF）肺病，对应「基因疗法……遗传性疾病药物」；原文：\"the first known genetic medicine to demonstrate successful delivery and durable expression of the cystic fibrosis transmembrane conductance regulator (“CFTR”) transgene in the lungs of people with cystic fibrosis\"、\"an inherited disorder that causes disease in the pulmonary airways\"、\"orphan drug designation in the United States for 4D-710 for the treatment of cystic fibrosis\"（SEC-0001193125-26-349173）。10-Q 竞争段落列出的在研大药企为 \"AbbVie Inc., Astellas Pharma Inc., Eli Lilly and Company, Johnson & Johnson, Merck & Company Inc., Regeneron Pharmaceuticals Inc., Roche, Sanofi and Vertex\"，不含 AstraZeneca；10-K 称 4D-710 最直接竞争者为 Vertex（MAN-FDMT-1）。该名单不是完整核查（未核查组合冲突）。注意：公司真正的主导资产是眼科 4D-150（3 期），但买方偏好图中没有眼科治疗领域，故改推 4D-710。"
thesis = [
  "AstraZeneca 需要「基因疗法、体内细胞疗法、补体/酶替代和遗传性疾病药物」；4DMT 的 4D-710（雾化吸入 AAV 基因疗法、A101 载体递送 CFTR 转基因，囊性纤维化肺病，AEROW 1/2 期已进入 2 期阶段）对应这一需求，因为它是不依赖 CFTR 突变类型、针对遗传病的基因疗法，并已获美国孤儿药与罕见儿科疾病认定。",
  "证据是开放标签 1 期剂量递增 16 例的中期数据：全部剂量组 CFTR 转基因表达持续至少 1 年，2.5E14 vg 剂量组 ppFEV1、LCI2.5 与 CFQ-R 呈临床意义改善信号，主要终点为安全性、无对照；下一事件是 AEROW 2 期部分主要终点数据（2027-06，CT.gov 估算；公司另披露 2026 年第四季度给出 AEROW 与项目更新）；主要障碍是权益附带义务：CFF 对许可/出售收入收取中个位数分成并在控制权变更时获付款，UC Regents 对转授权收取中十几至二十几百分比对价，且 Hercules 贷款以含知识产权的几乎全部资产作担保。"
]
thesis_sources = ["AZ-1", "AZ-3", "SEC-0001193125-26-349173", "MAN-FDMT-1", "MAN-FDMT-2", "CTG-NCT05248230"]

