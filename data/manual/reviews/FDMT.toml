[rights]
status = "full"
note = "4D-710 未许可给任何第三方：原文 \"it has not licensed, sold or otherwise transferred to another party the product developed under the CFF Agreement or the underlying technology\"（SEC-0001193125-26-349173）；产品专利申请 \"all owned by us\"，但 A101 载体为引进许可 \"We have also licensed several non-provisional patent applications, granted patents and international patent applications relating to our targeted and evolved vector, A101, which is used in 4D-710\"（MAN-FDMT-1），来自 UC Regents 独家全球许可，义务含 \"low single digit royalties on the net sales\" 与 \"sublicense consideration in the mid-teens to the mid-twenties-range on any future sublicensing arrangements\"（SEC-0001193125-26-349173）。CFF 义务：首次商业销售后付 \"six times the actual award received\"，对许可/出售收入付 \"royalties of a mid-single digit percentage, up to six times the actual award received\"，且 \"In the event of a change of control of the Company, CFF will receive certain payments\"；若连续 180 天停止开发则须授予 CFF \"irrevocable, exclusive worldwide interruption license\"（条件性，非现有权利）；2025-10 与 CFF 成立 \"Joint Steering Committee\" 用于 \"coordination of 4D-710’s development\"，我们判断为资助方治理安排，不属共同开发或期权（推断，中）。交易障碍（不改变权益状态）：Hercules 贷款已提取 \"$20.0 million was funded at closing\"，\"secured by a security interest in substantially all of our assets, including our intellectual property\"，并限制 \"merge with other companies or consummate certain changes of control\"（SEC-0001193125-26-349173）。对比：主导资产 4D-150 为部分权益，Otsuka 持有 \"Japan, Korea, China, Australia, and certain other Asia-Pacific markets\"，公司 \"retains full development and commercialization rights for 4D-150 outside the Otsuka Territory\"。"
sources = ["SEC-0001193125-26-349173", "MAN-FDMT-1"]
