[clinical]
design = "AEROW 多中心、开放标签、剂量递增与剂量扩展 1/2 期，入组不适合或因不良反应停用 CFTR 调节剂的 CF 患者；1 期 4 个剂量组共 16 例。原文：\"multicenter, open-label, dose-escalation and dose-expansion trial of 4D-710 in people with cystic fibrosis who are ineligible for CFTR modulator therapy\"、\"16 participants enrolled across four Phase 1 dose cohorts (2E15, 1E15, 5E14 and 2.5E14 vg)\"（MAN-FDMT-1）"
comparability = "单臂、无对照，与 CFTR 调节剂或其他在研基因疗法无直接比较；任何比较都是跨试验比较，人群与终点定义可能不同。入组人群为不适合调节剂的约 15% 患者。"
result = "全部剂量组 CFTR 转基因表达达到或高于非 CF 对照的生理水平并持续至少 1 年；2.5E14 vg 组 ppFEV1、LCI2.5 与生活质量（CFQ-R-R）1 年内均显示临床意义改善，选为 2 期剂量。原文：\"Durable CFTR transgene expression within or above target therapeutic range through at least 1 year across all dose levels\"、\"In 2.5E14 vg dose cohort, consistent evidence of clinically meaningful activity detected in all endpoints, including ppFEV 1 , LCI 2.5 and quality of life (CFQ-R-R) through 1 year\"、\"2.5E14 vg was selected as the Phase 2 dose\"（MAN-FDMT-1，数据截至 2025-12-01）"
limitation = "小样本、单臂、主要终点为安全性；疗效数据只来自一个剂量组，各组例数未在 10-K 中给出；10-K 未给出 ppFEV1 等的具体数值（待核实，需会议摘要或 2025-12 新闻稿原文）。安全性原文：\"4D-710-related adverse events were generally mild, transient and resolved by 2 months, with no 4D-710-related severe adverse events\"（低剂量组，MAN-FDMT-1）。"
sources = ["MAN-FDMT-1"]

