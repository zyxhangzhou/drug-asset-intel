match_note = "bexobrutideg（NX-5948）是口服、可入脑的 BTK 降解剂小分子，用于复发/难治 CLL/SLL；原文：\"an investigational oral CNS-penetrant BTK degrader\"（MAN-NRIX-2）。它对应 Roche 第 1 治疗领域画像中的「血液瘤的精准小分子」。但 Roche 已是该资产的全球独家被许可方，原文：\"the Company granted Roche an exclusive, worldwide license\"（SEC-0001549595-26-000049）。因此本组合不是新交易机会，只是记录现有合作；其他买方无可交易的 bexobrutideg 权益。10-K 竞争段只写 \"We are also aware of clinical-staged BTK degraders currently in development by multiple companies\"（SEC-0001549595-26-000016），未点名买方产品；未核查组合冲突。建议不入选。"
thesis = [
  "Roche 需要「血液瘤的精准小分子」；Nurix 的 bexobrutideg（NX-5948，口服 BTK 降解剂，复发/难治 CLL/SLL，3 期）对应这一需求，因为它在 BTK 抑制剂经治、高危突变患者中显示缓解，原文：\"Responses were observed across patients with BTK inhibitor resistance mutations\"（MAN-NRIX-3）。",
  "证据是 1a 期单臂剂量递增数据（n=48，ORR 83.0%，中位 PFS 22.1 个月，跨试验比较，无随机对照）；下一事件是关键单臂 2 期 DAYBreak CLL-201 主要终点完成（2028-01，估算）；主要障碍是权益：Nurix 已授予 Roche 全球独家许可，美国 50/50 共同开发与共同商业化、美国以外由 Roche 商业化，原文：\"granted Roche an exclusive, worldwide license\"（SEC-0001549595-26-000049）。",
]
thesis_sources = ["ROCHE-1", "ROCHE-2", "ROCHE-4", "MAN-NRIX-2", "MAN-NRIX-3", "SEC-0001549595-26-000049", "CTG-NCT07221500"]

