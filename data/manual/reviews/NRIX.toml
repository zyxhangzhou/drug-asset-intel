note = "最新 10-Q（截至 2026-08-31）合作附注：\"the Company granted Roche an exclusive, worldwide license, including with respect to the Company and its affiliates, to develop, manufacture, commercialize and otherwise exploit bexobrutideg\"；\"The Company and Roche will co-develop and co-commercialize bexobrutideg in the United States across all indications, and Roche will commercialize bexobrutideg outside the United States.\"；\"The parties will equally share net profits and net losses from commercialization in the United States.\"；美国以外 Nurix 收 \"tiered royalties at rates ranging from the low teens to the high teens\"；成本分摊 \"Global development costs will be shared 40 % by the Company and 60 % by Roche\"。Roche 可随时终止：\"each of Gilead, Sanofi, Pfizer and Roche can terminate its agreement with us in its entirety\"（SEC-0001549595-26-000049）。bexobrutideg 为自有发现（10-K：\"Our wholly owned pipeline of drug candidates comprises three clinical stage oncology programs\"，SEC-0001549595-26-000016），未见对第三方许可方的特许权使用费或里程碑义务。债务：10-Q 资产负债表负债只有应付账款、应计负债、经营租赁、递延收入与递延合作资金（\"Total liabilities | 226,987\" 千美元），无票据或贷款。资金：\"runway into the second half of 2029\"（MAN-NRIX-3）；10-Q：\"sufficient to fund our operations for at least the next 12 months\"。结论：受限；收购方案不成立，仅与 Roche 的现有合作兼容。"
