[clinical]
design = "NX-5948-301 1a/1b 期、开放标签、单臂。1a 期剂量递增：\"The Phase 1a dose escalation study enrolled 48 patients with relapsed/refractory CLL/SLL treated with bexobrutideg at doses ranging from 50 mg to 600 mg once daily\"；患者 \"having received a median of four prior lines of therapy (range 2–12)\"。1b 期较早线队列：Cohort 5（BTKi 经治、BCL2i 未治，n=19）与 Cohort 15（BTKi 未治含初治，n=20）（MAN-NRIX-2）。"
comparability = "无对照组。与 pirtobrutinib 或其他 BTK 抑制剂的任何比较都是跨试验比较，人群与终点定义可能不同；1a 期合并了 50–600 mg 多个剂量，注册剂量为 600 mg。头对头比较在 3 期 CLL-306 中进行：\"designed to evaluate the potential superiority of bexobrutideg versus pirtobrutinib in approximately 620 patients\"（MAN-NRIX-3），尚无结果。"
result = "1a 期（n=48，中位随访 22.4 个月）：\"Objective response rate (ORR) was 83.0% (95% CI: 69.2–92.4)\"，\"Median progression-free survival (PFS) was 22.1 months (95% CI: 14.0–NR)\"。1b 期：Cohort 5 \"ORR was 92.9% (95% CI: 66.1–99.8) among evaluable patients (n=14)\"；Cohort 15 \"ORR was 84.2% (95% CI: 60.4–96.6) among evaluable patients (n=19)\"。安全性（n=142）：\"No dose-limiting toxicities were observed\"，\"Treatment discontinuations due to adverse events occurred in only 5.6% of patients\"（MAN-NRIX-2）。"
limitation = "单臂 1 期，样本小；1b 期中位随访只有约 5 个月（\"Median follow-up was 5.2 months\"，MAN-NRIX-2），较早线队列 ORR 置信区间宽；数据截止 2026-01-01，来自公司新闻稿与 EHA 报告，未见同行评议全文；关键单臂 2 期与随机 3 期尚无读出。"
sources = ["MAN-NRIX-2", "MAN-NRIX-3", "CTG-NCT05131022"]

