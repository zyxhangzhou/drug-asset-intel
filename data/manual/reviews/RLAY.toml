note = '''10-Q / 10-K 未披露任何第三方持有 zovegalisib 的许可、选择权、优先谈判权或共同开发 / 共同商业化权利。唯一对外授权是 lirafugratinib（RLY-4008）给 Elevar，与 zovegalisib 无关："Elevar was granted exclusive global development and commercialization rights for lirafugratinib (RLY-4008)"（SEC-0001193125-26-338056）。Pfizer 只是临床试验合作与供药："entered into a clinical trial collaboration with Pfizer to evaluate atirmociclib"；"entered into a supply agreement with Pfizer pursuant to which Pfizer has agreed to supply atirmociclib and palbociclib"（SEC-0001193125-26-338056）。对许可方 D. E. Shaw Research 的义务：PI3K 靶点属 Category 1，"D. E. Shaw Research has no involvement with the clinical development or potential commercialization of these compounds and products ... and instead receives solely milestone and royalty payments"；"royalties in the low single digits on worldwide net sales"；每个产品开发与监管里程碑 "up to $7.3 million"、销售里程碑 "up to $36.0 million"；若向第三方授权，需分享 "a percentage of the proceeds of such transactions ranging from the low- to high-single digits"（MAN-RLAY-1）。专利归属 10-K 前后表述不一："we co-own with D.E. Shaw Research granted patents ... covering the composition of matter of zovegalisib"，同时 "have subsequently obtained sole ownership of intellectual property rights relating to it"（MAN-RLAY-1），收购尽调需核实。全球权益在公司手中为根据上述披露的推断。'''
sources = ["SEC-0001193125-26-338056", "MAN-RLAY-1"]
