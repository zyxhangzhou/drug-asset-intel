design = '''1/2 期、多中心、开放标签 TARGET-D 101（剂量递增 + 扩展 + 联合），原文 "The TARGET-D 101 Phase 1/2 trial is a multi-center, open-label, dose-escalation and dose-expansion study evaluating the safety and efficacy of VS-7375, both as monotherapy and in combination, in patients with advanced KRAS G12D-mutatedsolid tumors"（MAN-VSTM-3）。PDAC 疗效集为 mITT：原文 "A total of 22 patients that met the mITT criteria were included in the efficacy analysis and were treated with VS-7375 900 mg QD monotherapy with a median follow-up of 6.4 (0.8-10.9) months"；既往治疗 "a median of two prior lines of therapy (range 1–3)"（MAN-VSTM-3）。数据截止 "As of the data cutoff date of October 7, 2026"（MAN-VSTM-3）。'''
comparability = '''无对照组，与标准治疗无直接对比；跨试验比较，人群与终点定义可能不同。公司演示材料把 VS-7375 与 setidegrasib、INCB161734、zoldonrasib、daraxonrasib 的历史数据并列，并注明 "no head - to - head studies have been conducted and cross - trial comparisons may not be reliable due to differences in trial design and patient population/characteristics"；且部分对照药 ORR 含未确认缓解（"Reported unconfirmed response rate"）（MAN-VSTM-4）。'''
result = '''900 mg QD 单药 mPDAC：原文 "a confirmed objective response rate (ORR) of 50% (4/8) in second line (2L) PDAC, a 41% confirmed ORR (9/22) in the 2L+ setting, including two complete responses, one confirmed and one unconfirmed (treatment ongoing), and a 36% confirmed ORR (5/14) in the 3L/4L setting"；"The disease control rate (DCR) was 86% (n=22) in 2L+, the six-month landmark progression free survival (PFS) rate was 67%, and the landmark six-month overall survival (OS) rate was 80%"（MAN-VSTM-3）。生物标志物："15 of 17 patients with mPDAC treated with VS-7375 900 mg QD that had elevated baseline CA19-9 achieved greater than 50% reduction in the tumor marker"（MAN-VSTM-3）。安全性（900 mg，n=48）："The discontinuation rate due to adverse events (AEs) was 2%."；"Grade 3 TRAEs occurred in 10% of patients"（MAN-VSTM-3）。监管："Fast Track Designation (FTD) to VS-7375 for the first-line treatment of patients with KRAS G12D-mutated locally advanced or metastatic adenocarcinoma of the pancreas"（MAN-VSTM-3）。'''
