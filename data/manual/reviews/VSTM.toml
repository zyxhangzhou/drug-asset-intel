e substantial doubt about the Company’s ability to continue as a going concern"（SEC-0001104659-26-092007）；其后 2026-10 增发 "net proceeds from the Offering, after deducting underwriting discounts and commissions and estimated offering expenses, of approximately $234.7 million"（MAN-VSTM-5），9 月末初步现金 "Cash, cash equivalents and investments as of September 30, 2026 is estimated to be $172.8 million"（MAN-VSTM-2，未经审计）。'''
