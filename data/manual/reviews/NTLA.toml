note = "最新 10-Q 写明 lonvo-z 为全资资产，原文：\"Lonvo-z is a wholly owned, investigational in vivo CRISPR-based therapeutic candidate\"（SEC-0001193125-26-337952）；未见授权出去的区域或他方选择权。对许可方的义务：CRISPR/Cas9 底层专利来自 Caribou 独家许可，10-K 提到 \"low- to mid-single-digit royalty obligations under its in-license agreement with Caribou Biosciences, Inc.\"（MAN-NTLA-1，是否适用于 lonvo-z 待核实），10-Q 提到可能需向 \"Caribou and Rewrite Therapeutics, Inc.\" 支付里程碑与特许权使用费。交易障碍（不改变权益状态）：OrbiMed 贷款 \"secured on a first-priority basis, subject to certain exceptions, by security interests in substantially all assets of the Company, including its intellectual property\"，契约限制 \"effectuate mergers or consolidations, engage in asset sales and licensing transactions\"，且违约事件含 \"change of control\"（MAN-NTLA-3）。"
sources = ["SEC-0001193125-26-337952", "MAN-NTLA-1", "MAN-NTLA-3"]
