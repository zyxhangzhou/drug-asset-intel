[clinical]
design = "HAELO：全球、随机、双盲、安慰剂对照 3 期，2:1 随机，单次 50 mg 输注 lonvo-z 或安慰剂，主要终点为第 5–28 周 HAE 发作次数，共入组 80 例。原文：\"global, randomized, double-blind, placebo-controlled study\"、\"Patients were randomized 2:1 to receive a single 50 mg infusion of lonvo-z or placebo\"、\"In total, 80 patients were enrolled in the trial\"（SEC-0001193125-26-337952）"
comparability = "只与安慰剂比较，未与现有长期预防药物（如 10-K 所列 HAE 竞争公司的产品）直接对比；与其他 HAE 预防药的任何比较都是跨试验比较，人群与终点定义可能不同。"
result = "第 5–28 周发作减少 87%，月均发作 0.26 vs 2.10（p<0.0001）；全部关键次要终点达到统计学显著；lonvo-z 组 62% 完全无发作且无需治疗（安慰剂 11%）。原文：\"reduced attacks by 87% versus placebo, with a mean monthly attack rate of 0.26 in the lonvo-z arm compared with 2.10 in the placebo arm (p<0.0001)\"、\"62% of patients were entirely attack free and therapy free\"（SEC-0001193125-26-337952）"
limitation = "有效性评估期仅 6 个月，长期持久性与长期安全性待更长随访；HAELO 报告 \"there were no serious adverse events observed in the lonvo-z arm\"，但同平台（LNP 递送体内 CRISPR）的 nex-z 曾因 4 级转氨酶升高被临床暂停，原文：\"On October 29, 2025, the FDA placed a clinical hold\"，并发现 \"the highest observed liver transaminase elevations were in patients carrying one specific human leukocyte antigen\"（SEC-0001193125-26-337952），平台肝脏安全性是审评与买方尽调的关注点。"
sources = ["SEC-0001193125-26-337952", "CTG-NCT06634420"]

