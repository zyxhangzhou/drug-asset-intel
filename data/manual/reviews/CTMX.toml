[rights]
status = "full"
note = "事实：资产从 ImmunoGen（2024 年被 AbbVie 收购）独家引进，CytomX 拥有全球开发与商业化权：\"The license gives the Company the sole ability to develop, manufacture, use and commercialize any licensed product that incorporates, is comprised of, or otherwise derived from PROBODY technology that targets EpCAM in any human therapeutic field on a worldwide basis.\"（SEC-0001193125-26-337950）；10-K 同述 \"we obtained a worldwide, exclusive, sublicensable license to the EpCAM conditionally activated ADC program from ImmunoGen\"（MAN-CTMX-2）。未见对外授权、选择权或共同开发。对许可方的义务：剩余开发里程碑 \"expected to be triggered by the start of the first Phase 2 study and first Phase 3 study for an EpCAM program (e.g. Varseta-M)\"（各 1,000 万 / 2,000 万美元）、最高 3.2 亿美元监管与商业里程碑，\"ImmunoGen is also entitled to royalties on product sales ranging from the mid-to-high single digits percentages\"（SEC-0001193125-26-337950）。载荷同样来自 AbbVie：\"The Varseta-M payload is a topoisomerase-1 inhibitor licensed from AbbVie (formerly ImmunoGen)\"（MAN-CTMX-2）。平台层面另有 UCSB 独家许可（低个位数提成，\"annual minimum royalty obligations\"，SEC-0001193125-26-337950），是否适用于 Varseta-M 待核实。债务：10-Q 文本检索 loan / borrow / notes payable 未见借款，仅有可售债务证券投资。现金跑道：\"we expect our existing capital resources will be sufficient to fund operations into at least the second half of 2028\"（SEC-0001193125-26-337950）。"
sources = ["SEC-0001193125-26-337950", "MAN-CTMX-2"]
