match_note = "varsetatug masetecan（Varseta-M，CX-2051）是遮蔽式、条件激活的 EpCAM ADC（Topo-1 抑制剂载荷），首个适应症为转移性结直肠癌（消化道癌），并扩展到胃/胃食管结合部、胰腺癌、胆道癌，同时对应 BMS 画像中的「消化道癌」「ADC」「新靶点」三项；原文：\"the only EpCAM-directed antibody drug conjugate (ADC) in clinical development\"、\"initiating in Q3 2026 in gastric and gastroesophageal junction (GEJ), EpCAM-selected pancreatic ductal adenocarcinoma (PDAC), and EpCAM-selected biliary tract cancer (BTC)\"（MAN-CTMX-1）；\"EpCAM is a highly expressed tumor antigen that has previously been undruggable due to expression on normal tissues\"（MAN-CTMX-1）。组合冲突只按 10-K 的 CRC 竞品段核查：段中点名 \"AbbVie, Janssen, Merck KGaA, Pfizer, Exelixis, Revolution Medicines, Summit Therapeutics\" 等，无 BMS（MAN-CTMX-2）；BMS 只在泛 ADC 开发者名单中出现。未核查 BMS 早期管线是否有 EpCAM 或 CRC ADC。另：BMS 曾是 CytomX 平台合作方，已于 2026 年 5 月终止合作：\"Bristol Myers Squibb subsequently terminated the collaboration in May 2026 after electing not to advance the remaining preclinical programs\"（SEC-0001193125-26-337950），该合作不涉及 Varseta-M。"
thesis = [
  "Bristol Myers Squibb 需要「肺癌、乳腺癌、消化道癌…的双抗、ADC或新靶点资产」；CytomX 的 varsetatug masetecan（遮蔽式 EpCAM Topo-1 ADC，转移性结直肠癌，1 期）对应这一需求，因为它同时是消化道癌、ADC 和新靶点：公司称其为临床开发中唯一的 EpCAM ADC，并已向胃/胃食管结合部、胰腺癌、胆道癌扩展。",
  "证据是 1 期剂量扩展的单臂中期数据（3L+ CRC，10 mg/kg 组确认 ORR 32%（6/19）、中位 PFS 7.1 个月，数据截止 2026-01-16），与晚线标准治疗「个位数缓解率」只能做跨试验比较，且有 1 例治疗相关 5 级急性肾损伤；下一事件是首个单药注册研究启动（2027 年上半年，明确披露，取决于与 FDA 对齐）；主要障碍是许可方义务：资产从 ImmunoGen（现 AbbVie）引进，尚欠 1 千万 / 2 千万美元的 2 期 / 3 期启动里程碑、最高 3.2 亿美元监管与商业里程碑及中至高个位数销售提成，而 AbbVie 自身也有 CRC 3 期 ADC（ABBV-400）；成本不构成障碍（快照 EV 约 1.84 亿美元）。",
]
