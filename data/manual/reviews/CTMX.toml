[clinical]
design = "CTMX-2051-101 首次人体 1 期（NCT06265688）：剂量递增 + 剂量扩展 + 剂量优化，单臂、开放标签，晚线转移性结直肠癌，每 3 周给药；数据截止 2026-01-16 时 CRC 入组 93 例，其中扩展剂量 7.2/8.6/10 mg/kg 共 60 例、可评估疗效 56 例；原文：\"a total of 93 patients with late-line metastatic CRC had been enrolled in the study\"（MAN-CTMX-2）。2025 年 4 月首批数据人群：\"Patients enrolled in the study at the time of data cutoff had previously received a median of 4 prior lines of therapy and all patients had previously been treated with irinotecan\"（MAN-CTMX-2）。1 期已入组完毕：\"Enrollment into the Varseta-M Phase 1 clinical study is complete with 113 total patients enrolled\"（MAN-CTMX-1）。"
comparability = "单臂，无对照组。公司把晚线 CRC 标准治疗描述为 \"single digit percentage response rates, median progression free survival of 2 to 5.6 months\"（MAN-CTMX-2），这是跨试验比较，人群与终点定义可能不同；1 期人群为重度预治疗（中位 4 线、全部用过伊立替康），与标准治疗关键试验人群不一定一致。"
result = "确认 ORR：7.2 mg/kg 6%（1/17）、8.6 mg/kg 20%（4/20）、10 mg/kg 32%（6/19）；中位 PFS 分别 5.5、6.8、7.1 个月；DCR 88%（49/56）；原文：\"At the 8.6 mg/kg dose, the confirmed response rate was 20% with an estimated median PFS of 6.8 months and at the 10 mg/kg dose, the confirmed response rate was 32% with an estimated median PFS of 7.1 months. The disease control rate was 88% (49/56)\"（MAN-CTMX-2）。安全性：\"The most common TRAE was diarrhea which was generally manageable and reversible.\"，采用更新的预防方案后 \"Grade 3 diarrhea was 10%\"（MAN-CTMX-2）。"
limitation = "中期数据、样本小、中位随访约 8 个月（\"Median duration of follow-up across the efficacy-evaluable patient population was approximately 8 months\"），PFS 95% CI 上限为 NE（MAN-CTMX-2）。有 1 例治疗相关死亡：\"there was one treatment-related grade 5 acute kidney injury (AKI) in a patient treated at the 7.2 mg/kg dose\"（MAN-CTMX-2）。剂量优化组数据（8.6 / 10 mg/kg，按调整理想体重给药）尚未公布：\"A Phase 1 data update is expected by the end of 2026 with a focus on dose selection for late phase development.\"（MAN-CTMX-1）。无同行评议全文；未打开会议摘要原文。"
sources = ["MAN-CTMX-1", "MAN-CTMX-2", "CTG-NCT06265688"]

