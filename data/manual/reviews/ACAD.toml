match_note = "remlifanserin（原 ACP-204）是高选择性 5-HT2A 反向激动剂，用于阿尔茨海默病精神病（幻觉与妄想），每日一次给药；原文：\"Remlifanserin is a novel, highly selective 5HT2A receptor inverse agonist being developed to treat Alzheimer’s disease psychosis and Lewy body dementia psychosis.\"（MAN-ACAD-2）。它落在 AbbVie 第 2 治疗领域（神经科学）画像中的「阿尔茨海默病」，但画像写的是「阿尔茨海默病/抗tau」，偏疾病修饰；ADP 是症状治疗，故不按「具体需求条目」计 4 分。技术类型对应「口服中枢小分子」：公司称其为 \"a new chemical entity\"（MAN-ACAD-1），CT.gov 写 \"Administration once daily at approximately the same time of day, with or without food\"（CTG-NCT06159673），口服为推断（中高）。AbbVie 技术行要求「有明确认知/情绪疗效」，本资产不针对认知/情绪，此点不满足。10-K 竞争段未点名任何买方产品；未核查组合冲突。"
thesis = [
  "AbbVie 需要「抑郁、精神分裂症、阿尔茨海默病/抗tau……可形成新神经平台的资产」；Acadia 的 remlifanserin（原 ACP-204，高选择性 5-HT2A 反向激动剂，阿尔茨海默病精神病，3 期）对应这一需求，因为它是针对阿尔茨海默病幻觉与妄想的每日一次中枢小分子，而该适应症目前没有 FDA 批准药物。",
  "证据是 2 期 RADIANT 随机对照试验 60 mg 组主要终点 SAPS-H+D 未达统计学显著（p=0.0603），关键次要终点 CGI-S-ADP 名义显著（p=0.0077），仅有安慰剂对照；下一事件是 RADIANT 3 期主要终点完成（2028-01，估算，CT.gov 主方案预计主要完成日）；主要障碍是成本：快照 EV 约 25.4 亿美元（20–50 亿档），且收购需连同 NUPLAZID 与 DAYBUE 两个上市业务一并定价。",
]
