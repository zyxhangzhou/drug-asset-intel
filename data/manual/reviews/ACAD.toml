[clinical]
design = "RADIANT 2 期部分：全球多中心、随机、双盲、安慰剂对照，remlifanserin 30 mg 与 60 mg 每日一次对比安慰剂，6 周，计划入组约 318 例；原文：\"global, multi-center, randomized, double-blind, placebo-controlled trial that will enroll approximately 318 patients\"、\"The primary endpoint is change from baseline to week 6 on the Scale for the Assessment of Positive Symptoms–Hallucinations and Delusions subscales (SAPS-H+D) total score\"（MAN-ACAD-1）。2 期与两项 3 期在同一主方案下无缝入组：\"A Master Protocol for Three Independent, Seamlessly Enrolling, Double-blind, Placebo-controlled Efficacy and Safety Studies\"（CTG-NCT06159673）。"
comparability = "仅安慰剂对照。ADP 无已批准药物可作直接对比：\"There is no FDA-approved drug for the treatment of Alzheimer’s disease psychosis.\"（MAN-ACAD-2）。与超说明书抗精神病药或 pimavanserin 既往试验的任何比较都是跨试验比较，人群与终点定义可能不同。"
result = "60 mg 组 SAPS-H+D 变化 -12.6 对安慰剂 -10.4，标准化效应量 0.26，p=0.0603（未达显著）；关键次要终点 CGI-S-ADP -1.3 对 -0.9，效应量 0.37，名义 p=0.0077；30 mg 组几乎无改善；安全性与安慰剂相近，无 QT 延长信号。原文：\"demonstrated a change of -12.6 versus a -10.4 change for placebo at week 6, yielding a standardized effect size of 0.26 (p=0.0603)\"、\"The 30 mg dose showed minimal improvement across endpoints compared to placebo\"、\"There was no signal of QT prolongation versus placebo\"（MAN-ACAD-2）。"
limitation = "主要终点未达标；次要终点 p 值为名义值（未经多重性校正）；分析人群为预设 mFAS，未见 ITT 结果；数据只来自公司顶线公告，同行评议全文与 CTAD 报告尚未发布；公司随后修改 3 期方案（\"removing the 30 mg dosage arm\"，MAN-ACAD-2），3 期设计与样本量变更细节未披露。"
sources = ["MAN-ACAD-1", "MAN-ACAD-2", "CTG-NCT06159673"]

