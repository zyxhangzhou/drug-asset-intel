note = "大中华区权益已归 Sanofi，其余地区由 Arrowhead 持有。10-Q 原文：\"Greater China rights for plozasiran are out-licensed to Sanofi\"（SEC-0000879407-26-000057）；8-K 原文：\"Arrowhead retaining rights to REDEMPLO in all geographies, outside of Greater China\"（MAN-ARWR-2）。该授权经 Arrowhead 控股的 VIE Visirna（持股 \"decreased from 66.25 % to 56.38 %\"）转让给 Sanofi，Arrowhead 收取大中华区特许权使用费：\"the Company is eligible to receive royalties from Sanofi on net commercial product sales in Greater China\"（SEC-0000879407-26-000057）。引进与对外义务：10-K 记载经 Novartis 受让的 Alnylam 许可为 \"royalty-bearing, exclusive license with limited sublicensing rights\"，覆盖 \"30 undisclosed gene targets\"（MAN-ARWR-1），APOC3 是否在内、plozasiran 是否欠特许权使用费未核实。其他交易障碍：Ionis 专利诉讼，\"planned commercialization of investigational plozasiran\"（SEC-0000879407-26-000057）；债务：\"aggregate principal amount of 0.00% Notes due January 15, 2032\"（7 亿美元可转债）、Sixth Street 信贷余额 1.814 亿美元（\"Credit Facility | 181,366\"，MAN-ARWR-2），其条款限制 \"asset sales and licensing transactions\"（SEC-0000879407-26-000057）。"
