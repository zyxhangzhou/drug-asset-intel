thesis = [
  "Novartis 需要「血脂及代谢炎症资产」并把「xRNA/siRNA及递送」列为首位技术偏好；Arrowhead 的 plozasiran（APOC3 siRNA，重度高甘油三酯血症 sHTG，3 期已读出、FCS 适应症已获 FDA 批准）对应这一需求，因为它是已上市验证的 siRNA 降甘油三酯药物，正向更大的 sHTG 人群扩展。",
  "证据是两项全球 3 期 SHASTA-3/SHASTA-4 均达到「相对安慰剂降低甘油三酯」的主要终点，甘油三酯中位降幅 79% 和 81%，汇总人群急性胰腺炎事件相对安慰剂减少 78%（只有安慰剂对照，与已上市 APOC3 药物无直接对比）；下一事件是 sHTG 适应症 sNDA 提交并使用优先审评券（公司称 2026 年底前，明确披露）；主要障碍是成本：EV 约 78–82 亿美元（市值按快照，现金与债务按 2026-06-30）（50–150 亿档），另有大中华区权益已归 Sanofi、Ionis 专利诉讼、7 亿美元可转债与 Sixth Street 信贷协议对资产出售和许可的限制条款。",
]
