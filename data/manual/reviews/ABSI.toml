[clinical]
design = "HEADLINE 1/2a 期，随机、双盲、安慰剂对照，原文 \"a randomized, double-blind, placebo-controlled study expected to enroll up to 227 male and female healthy volunteers at multiple sites in Australia\"（SEC-0001672688-26-000136）；主要终点为安全性，原文 \"Primary endpoints include the incidence of treatment-emergent adverse events\"，疗效为探索性，原文 \"such an analysis would not be multiplicity-adjusted and report only nominal p-values\"（MAN-ABSI-1）。"
comparability = "无疗效数据，无法与标准治疗（米诺地尔、非那雄胺）比较。同机制竞品 HMI-115（Hope Medicine，抗 PRLR）在研，原文 \"Hope Medicine’s HMI-115\"（MAN-ABSI-1）。"
result = "SAD 中期盲态数据（32 名健康受试者，IV 150–1800 mg）：原文 \"No serious adverse events were reported as of the data cutoff date\"，\"half-life for ABS-201 is estimated to be at least 65 days\"，\"No apparent impact of anti-drug antibodies (ADAs) on PK was observed\"（MAN-ABSI-3）。"
limitation = "盲态汇总数据，未按剂量组揭盲；只有单剂量静脉给药，皮下多剂量（MAD）仍在进行，原文 \"the study has advanced into the subcutaneous multiple ascending dose (MAD) portion in participants with AGA\"（MAN-ABSI-3）；即将读出的疗效为探索性终点，未做多重性校正（MAN-ABSI-1）。"
sources = ["SEC-0001672688-26-000136", "MAN-ABSI-1", "MAN-ABSI-3"]

