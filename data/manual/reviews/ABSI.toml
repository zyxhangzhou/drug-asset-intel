[rights]
status = "full"
note = "推断（置信度：中）：10-K 与 10-Q 均无\"拥有全球权益\"的明确句子；依据如下。10-K 原文 \"We intend to advance a limited number of internally developed programs, such as ABS-201, through clinical development and potential commercialization\"（MAN-ABSI-1），ABS-201 为自有平台设计，原文 \"These programs have been generated using our platform capabilities\"（MAN-ABSI-1）。10-K 附件清单（Item 15）无任何许可或合作协议，引进许可在风险因素中仅为将来时 \"We may come to rely on in-licenses from third parties\"（MAN-ABSI-1）；Merck、AstraZeneca、Almirall 为平台药物创造合作（\"Partnered Programs\"），文中未与 ABS-201 关联（MAN-ABSI-1）。Lilly 2026 年 6 月股权投资不含项目权利，原文 \"does not confer any program rights to Eli Lilly\"（MAN-ABSI-2，新闻稿，非 10-Q）。未见对许可方的里程碑或特许权使用费义务。债务：10-Q 资产负债表 \"Long-term debt | 150\"（千美元，SEC-0001672688-26-000136），来自设备融资 \"Master Financing Agreement (MFA)\"，金额可忽略。"
sources = ["MAN-ABSI-1", "SEC-0001672688-26-000136", "MAN-ABSI-2"]
