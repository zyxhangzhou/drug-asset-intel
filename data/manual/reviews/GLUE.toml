note = "事实：10-K：\"worldwide rights to the programs shown in Figure 1 below, except for MGDs directed against VAV1 including MRT-6160, which we licensed to Novartis in October 2024, and the targets included in the Roche and Novartis relationships\"（MAN-GLUE-1），GSPT1 专利列在「Wholly Owned Product Candidates」下：\"With respect to our GSPT1 program, as of December 31, 2025, our portfolio included two granted US patents\"，最早到期 \"would be 2040\"（MAN-GLUE-1）。10-K 与 10-Q 的合作协议段只有 Roche（肿瘤 / 神经靶点，由 Roche 选定）与 Novartis（VAV1、免疫项目），未见 MRT-2359 的对外授权或引进许可，故无特许权使用费 / 里程碑义务（推断，中高）。Roche 靶点清单未公开，GSPT1 是否在内只能由「Wholly Owned」归类推断不在内。J&J 仅为 apalutamide 临床供药方：\"Monte Rosa has a clinical supply agreement with Johnson & Johnson to support the Phase 2 trial\"（MAN-GLUE-2），条款未披露，10-Q 未提及。无借款：10-Q 资产负债表负债只有应付账款、应计费用、递延收入、设定受益计划负债与经营租赁负债，无借款科目（SEC-0001193125-26-336711）。资金：\"support our cash runway into 2029\"（SEC-0001193125-26-336711）。整体收购时的公司层面负担：MRT-6160 \"will share 30% of any profits and losses associated with the manufacturing and commercialization of the licensed products in the U.S.\"；2025 Novartis 协议 \"the exclusive option to obtain exclusive, royalty-bearing, sublicensable and transferable licenses with respect to two programs\"；Roche 合作 \"at the conclusion of the Roche Agreement in October 2028\"（SEC-0001193125-26-336711）。"
sources = ["MAN-GLUE-1", "MAN-GLUE-2", "SEC-0001193125-26-336711"]
