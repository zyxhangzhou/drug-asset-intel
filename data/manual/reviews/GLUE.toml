[clinical]
design = "1/2 期（NCT05546268）2 期扩展组：MRT-2359 0.5 mg 每日（21 天给药 / 7 天停药）联用 enzalutamide，入组重度经治、RECIST 可测量病灶的转移性 CRPC；截至 2026-01-30 入组 23 例、可评估 15 例；原文：\"reported results for 23 patients that had been enrolled as of the January 30 2026 data cut-off\"、\"Of the 23 patients enrolled as of the data cutoff, 15 were evaluable for efficacy\"、\"78% of patients had been previously treated with second generation androgen receptor inhibitors, 83% with chemotherapy, and 57% with Pluvicto\"（MAN-GLUE-1）。后续 2 期 MODeFIRe-1 为 Simon 两阶段设计、联用 apalutamide：\"The study is expected to enroll up to 25 patients with metastatic CRPC harboring AR mutations\"（MAN-GLUE-1）。"
comparability = "单臂、无对照，无与标准治疗（如二代 AR 抑制剂单药、化疗、Pluvicto）的直接比较；10-K 中安全性与 EZH2 抑制剂等的比较为公司对第三方数据的跨试验比较，人群与终点定义可能不同；原文：\"the safety profile observed was favorable when our data was compared with third-party data on other drugs emerging as combination agents for metastatic CRPC\"（MAN-GLUE-1）。"
result = "15 例可评估患者 DCR 67%、10/15 靶病灶缩小；AR 突变亚组 5/5 PSA 应答（2 例 PSA90、3 例 PSA50），2 例 RECIST PR（1 例确认、1 例未确认）、3 例 SD；原文：\"Across those 15 evaluable patients, the overall disease control rate was 67% (10 of 15)\"、\"This includes 2 PSA90 responses and 3 PSA50 responses\"、\"Two of the 5 AR mutant patients achieved a RECIST partial response (PR), one confirmed and one unconfirmed\"（MAN-GLUE-1）。安全性：\"One patient had a dose-limiting toxicity (DLT) (grade 3 stomatitis associated with pain)\"、\"No dose discontinuations were observed due to AEs\"（MAN-GLUE-1）。"
limitation = "样本小（AR 突变亚组 5 例），疗效分析排除了 3 例神经内分泌转化患者：\"3 patients were excluded from data analysis based on molecular profiling of their baseline biopsies showing transformation to neuroendocrine differentiation\"（MAN-GLUE-1）；10-K 只对 AR 突变亚组报告全部 PSA 应答，AR 野生型 / AR-V7 患者的应答数未在文字中给出（图表未抽取）；PSA 与 DCR 为替代终点，无 rPFS / OS 数据；只有公司 10-K 与新闻稿，无同行评议全文。8-K 称该组 AR 突变患者最终入组 6 例（\"A total of 6 patients with AR mutation were enrolled\"，MAN-GLUE-2），第 6 例数据未公布。"
sources = ["MAN-GLUE-1", "MAN-GLUE-2", "CTG-NCT05546268"]

