[clinical]
design = "COMPANION-002：随机、对照 2/3 期，二线（既往一种方案）不可切除晚期、转移或复发胆道癌，tovecimig + 紫杉醇（n=111）对紫杉醇单药（n=57），允许对照组交叉；疗效由盲态独立中心评估（BICR）；原文：\"evaluated tovecimig plus paclitaxel versus paclitaxel alone in patients with unresectable advanced, metastatic or recurrent biliary tract cancer (BTC) treated in the second-line setting\"、\"All responses were assessed by blinded independent central review (BICR).\"（MAN-CMPX-3）。"
comparability = "对照组为紫杉醇单药，是同一试验内随机对照，不是跨试验比较；但紫杉醇单药并非公认二线标准治疗（10-K：\"there is no generally accepted standard of care in later lines of treatment\"，MAN-CMPX-1）。对照组 54% 交叉到 tovecimig，OS 比较被交叉干扰；公司引用的交叉/非交叉亚组 OS 为事后分析：\"Post Hoc Subset Analyses\"（MAN-CMPX-3）。"
result = "主要终点 ORR 18.0%（20/111）对 5.3%，p=0.0228（终版分析）：\"the ORR improved to 18.0% (20/111 patients)\"、\"the p-value also improved to 0.0228\"（SEC-0001171843-26-005295）。次要终点 PFS 中位 4.7 对 2.6 个月：\"median progression-free survival (PFS) of 4.7 months versus 2.6 months, providing a 56% reduction in the risk of progression (hazard ratio=0.44, p<0.0001)\"（SEC-0001171843-26-005295）。ITT OS 8.9 对 9.4 个月：\"tovecimig in combination with paclitaxel had a median OS of 8.9 months compared to 9.4 months for the control arm\"、\"(HR=1.05, p=0.78)\"（MAN-CMPX-3）。"
limitation = "OS 次要终点未达统计学意义：\"did not meet statistical significance\"（SEC-0001171843-26-005295）；交叉校正分析不可解释：\"its results here are largely uninterpretable\"（MAN-CMPX-3）。FDA 建议先做证明生存获益的试验：\"The FDA recommended that Compass conduct a trial to demonstrate a survival benefit prior to submitting a BLA for tovecimig.\"（MAN-CMPX-2）。数据来自公司新闻稿与 10-Q，尚未打开同行评议全文或 ESMO 2026 摘要。"
sources = ["SEC-0001171843-26-005295", "MAN-CMPX-1", "MAN-CMPX-2", "MAN-CMPX-3", "CTG-NCT05506943"]

