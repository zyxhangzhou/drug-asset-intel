[rights]
status = "partial"
note = "事实（10-K）：公司从 ABL Bio 引进除韩国外的全球独家权益，韩国权益在 Handok，中国权益已对外授权给 Elpiscience：\"We have licensed exclusive global rights to tovecimig, outside of South Korea, from ABL Bio\"、\"South Korean rights are held by Handok Pharmaceuticals, Inc. (“Handok”) and China rights were out-licensed to Elpiscience Biopharmaceuticals Co., Limited (“Elpiscience”).\"、\"We hold worldwide rights to all of our product candidates (with the exception of limited countries for tovecimig)\"（MAN-CMPX-1）。协议写有「共同开发」字样，但分工为 ABL Bio 负责至 1 期结束、公司负责 2 期起：\"ABL Bio responsible for development of tovecimig throughout the end of Phase 1 clinical trials and TRIGR responsible for the development of tovecimig from Phase 2 and onward\"（MAN-CMPX-1）；未见选择权、优先谈判权、共同商业化或利润分成条款。引进义务：\"up to $96 million of development and regulatory milestone payments, up to $303 million of commercial milestone payments and tiered single-digit royalties on net sales of tovecimig in oncology\"（MAN-CMPX-1）。债务：10-Q 资产负债表负债只有应付账款、应计费用和经营租赁（\"Total liabilities\" 24,124 千美元），未见借款；资金指引：\"the Company expects such cash resources will fund operating expenses and capital expenditure requirements into 2028\"（SEC-0001171843-26-005295）。"
sources = ["MAN-CMPX-1", "SEC-0001171843-26-005295"]
