match_note = "GSK 第 1 治疗领域（肿瘤）画像点名「实体瘤的…免疫肿瘤资产」；RP2 是溶瘤免疫疗法（HSV-1 骨架，表达抗 CTLA-4 抗体样分子），用于实体瘤转移性葡萄膜黑色素瘤（mUM），注册导向随机 2/3 期 REVEAL 正在入组。原文：\"Our proprietary RPx platform is based on a novel, engineered strain of herpes simplex virus 1\"、\"RP2 has been engineered to express an antibody-like molecule intended to block the activity of CTLA-4\"（SEC-0001628280-26-045886）；\"registration-directed study of RP2 in mUM patients who are immune checkpoint inhibitor-naïve\"（SEC-0001628280-26-067722）。画像只到「免疫肿瘤 + 实体瘤」层级，未点名葡萄膜黑色素瘤或溶瘤病毒，故只对应到领域 + 技术类型。同平台 RP1（TUDRIQEV）已获 FDA 加速批准：\"granted accelerated approval for TUDRIQEV\"（MAN-REPL-1）。未核查组合冲突：10-K 竞争段只列竞品类别（\"oncolytic immunotherapies, including T-Vec and other oncolytic immunotherapies in clinical trials\"），未列 GSK 产品；GSK 自身管线未查。"
thesis = [
  "GSK 需要「肺癌、血液瘤和实体瘤的…免疫肿瘤资产」（Phase 2-3）；Replimune 的 RP2（HSV-1 溶瘤免疫疗法、表达抗 CTLA-4 抗体样分子，转移性葡萄膜黑色素瘤，注册导向随机 2/3 期 REVEAL 入组中）对应这一需求，因为它是实体瘤免疫肿瘤资产，且同一 RPx 平台的 RP1（TUDRIQEV）已于 2026-08-06 获 FDA 加速批准。",
  "证据是 1 期单臂 mUM 队列 ORR 29.4%（5/17）、中位 DOR 11.47 个月、DCR 58.8%，样本小且多为免疫治疗经治人群，与 REVEAL 的免疫检查点抑制剂初治人群不同，只能跨试验参照；下一事件是 REVEAL 由 2 期转入 3 期（2027 年第一季度，明确披露）；主要障碍是资金与债务：Hercules 有担保定期贷款未来应付本金 1.0245 亿美元（附契约限制），公司指引现金仅「greater than twelve months」，快照 EV 约 13.1 亿美元（<20 亿档），且收购标的价值主要在已上市的 TUDRIQEV 而非 RP2。",
]
