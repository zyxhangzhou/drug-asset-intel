[clinical]
design = "RP2 1 期剂量递增/扩展试验中的 mUM 队列，单臂，RP2 单药或联合 nivolumab，17 例；原文：\"from our Phase 1 clinical trial of RP2 alone and in combination with nivolumab\"、\"one of the responding patients was treated with RP2 monotherapy and four of the responding patients were treated with RP2 combined with nivolumab\"（SEC-0001628280-26-045886）。"
comparability = "单臂，无对照。人群多为免疫治疗经治：\"Nearly all patients (15 of 17, 88.2%) in the study had progressed on or after immunotherapy\"（SEC-0001628280-26-045886）；而 REVEAL 入组免疫检查点抑制剂初治患者，对照为 ipilimumab+nivolumab：\"RP2 in combination with nivolumab vs. ipilimumab in combination with nivolumab in immune checkpoint inhibitor naïve adult patients with metastatic uveal melanoma\"（SEC-0001628280-26-045886）。与任何标准治疗的比较都是跨试验比较，人群与终点定义可能不同。"
result = "ORR 29.4%（5/17），中位 DOR 11.47 个月，DCR 58.8%；原文：\"RP2 led to an ORR of 29.4% (5 of 17 patients\"、\"The median DOR at the data cutoff was 11.47 months\"、\"the disease control rate for this cohort of mUM patients was 58.8%\"（SEC-0001628280-26-045886）。安全性：\"There were no grade 4 or 5 TRAEs\"（SEC-0001628280-26-045886）。"
limitation = "样本 17 例；单药与联合混合；数据为 2023 年 11 月会议更新（\"In November 2023, we presented updated data from a cohort of mUM patients\"）与 2024 年 6 月 DCR 更新，10-K 未给出更新的疗效数据；未打开会议摘要或同行评议原文。REVEAL 主要终点为 OS 与 PFS：\"The primary endpoints of the trial are overall survival and progression free survival\"（SEC-0001628280-26-045886），尚未读出。"
sources = ["SEC-0001628280-26-045886"]

