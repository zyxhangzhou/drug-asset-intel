[rights]
status = "full"
note = "推断（中高）：10-K 与 10-Q 未逐字写「全球权益」。RPx 平台为公司自有：\"Our proprietary RPx platform is based on a novel, engineered strain of herpes simplex virus 1\"，专利为公司申请：\"For the core technology in our RPx platform and each of our product candidates, we initially filed six patent applications under the Patent Cooperation Treaty\"（SEC-0001628280-26-045886）。10-K 附件清单中协议类只有 BMS（RP1、RP2）与 Regeneron 的临床试验合作及供药协议，无许可协议。BMS 只供药并授予 nivolumab 使用许可：\"BMS granted us a non-exclusive, non-transferrable, royalty-free license (with a right to sublicense) under its intellectual property to use nivolumab in the clinical trial\"、\"Both parties will own the study data produced in the clinical trial\"（SEC-0001628280-26-045886）；\"BMS supplied nivolumab is being used in the conduct of the REVEAL clinical trial\"（SEC-0001628280-26-067722）。数据共有，但不是选择权、优先谈判权或共同开发。Roche（RP2 HCC 供药）：\"retaining all the rights to the development and commercialization of our product candidates\"（SEC-0001628280-26-045886）。未见对许可方的特许权使用费或里程碑义务；风险因素中有模板句 \"our licensed patents\"，未找到对应许可协议，列入待核实。债务：Hercules 有担保定期贷款，\"aggregate maximum principal amount of up to $ 200.0 million\"，2026 年 9 月 \"drew down the initial tranche 4 amount of $ 15.0 million\"，未来应付本金合计 \"102,453\"（千美元），契约 \"could prevent us from taking certain actions without the consent of our lenders\"（SEC-0001628280-26-067722）。控制权变更时的提前还款条款未核查。"
sources = ["SEC-0001628280-26-045886", "SEC-0001628280-26-067722"]
