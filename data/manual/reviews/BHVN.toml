  "强生（免疫炎症，第 2 优先）需要「FcRn、IL-23、自身抗体清除和慢性炎症疾病的长效生物药」；Biohaven 的 BHV-1300（MoDE 细胞外 IgG 降解剂，Graves 病，3 期）对应这一需求，因为它通过清除致病 IgG1 自身抗体治疗 Graves 病，原文：\"BHV-1300 MoDE has entered Phase 3\"。",
