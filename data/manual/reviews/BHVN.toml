[rights]
status = "partial"
note = "BHV-1300 所在 MoDE pan IgG 降解剂组合已独家授权 Ono（日本、韩国、台湾、东盟），原文：\"The Company retains all rights to the licensed portfolio outside the Ono Licensed Territory, including in the United States, Europe and China.\"。可能加重限制的条款：Ono \"sharing specified costs of global clinical studies\"；Ono 对 Ono 区域内部分后续化合物有 \"right of first negotiation with respect to certain follow-on compounds in the Ono Licensed Territory\"（不含 BHV-1300 本身）；双方 \"specified restrictions on each party’s activities involving competing IgG degraders\"。引进许可：Yale MoDE 平台 \"worldwide, exclusive license agreement with Yale\"，须付 \"low single digit royalties on the net sales of licensed products\"，剩余里程碑开发 1.063 百万美元、商业 4.988 百万美元（原文单位千美元：\"$ 1,063 and $ 4,988\"），另付 Yale 分许可收入的 \"low single-digit percentage of sublicense income\"；Moda 顾问协议剩余里程碑开发 27.995、监管 22.0、商业 104.612 百万美元（原文：\"$ 27,995 , $ 22,000 , and $ 104,612\"）。融资负担：Oberland 票据 2.5 亿美元，产品获 FDA/EMA 批准时付里程碑，原文：\"equal to 35 % of the Total Funded Amount upon the approval by the FDA or European Medicines Agency (“EMA”) of troriluzole or other Company products\"；控制权变更触发持有人回购权（\"Put Option\" … \"a change of control\"）；契约限制 \"merge or consolidate\"。（均见 MAN-BHVN-1）"
sources = ["MAN-BHVN-1", "MAN-BHVN-2"]
