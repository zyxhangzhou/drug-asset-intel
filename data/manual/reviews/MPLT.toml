[rights]
status = "full"
note = "推断（中高）：10-K 写明公司自有 ML-007 物质组成专利，原文：\"we own three issued U.S. patents covering the composition of matter of ML-007\"，以及复方相关申请 \"directed to the combination of ML-007 and a PAC to treat, among other things, schizophrenia and ADP\"（MAN-MPLT-1）。ML-007 来源于 NeuroSolis 资产购买（非许可）：\"NeuroSolis sold us its assets related to both its proprietary M 1 /M 4 agonist molecules\"；剩余义务为或有发股：\"the additional 35,476 shares of the Company's common stock would be required to be issued\"（SEC-0001193125-26-349554）。另有 Vanderbilt 独家全球许可（\"exclusive, royalty-bearing, worldwide sublicensable license\"，标的为 \"certain compounds and licensed products\"，里程碑最高 \"$ 52.4 million\"、\"royalties at a low single digit percentage\"），文件未说明涵盖哪些化合物，是否涉及 ML-007C-MA 待核实（MAN-MPLT-1）；该协议是引进许可（权利流向 MapLight），即使覆盖本资产，也只增加对许可方的里程碑与特许权使用费义务，不改变 full 状态。10-K 与最新 10-Q 中检索 right of first / option to / co-commerc / profit shar 均无与本资产相关结果；10-K 仅表示将来 \"opportunistically explore commercialization partnerships, particularly with entities that have strong capabilities in geographies outside the United States\"（意向，非现有限制）。文件没有逐字写「全球权益」，故为推断。债务：10-Q 资产负债表负债只有应付账款、应计费用与租赁负债，负债合计 20,049 千美元（10-Q 资产负债表 \"Total liabilities\" 行），无票据或贷款。资金：\"together with the expected proceeds from our 2026 Private Placement, will be sufficient to fund our operations through 2028\"（SEC-0001193125-26-349554）。"
sources = ["MAN-MPLT-1", "SEC-0001193125-26-349554"]
