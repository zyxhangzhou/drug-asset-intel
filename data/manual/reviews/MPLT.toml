[clinical]
design = "ZEPHYR：2 期、随机、双盲、安慰剂对照，美国 25 个中心，住院急性加重成人精神分裂症患者 307 例按 1:1:1 随机至安慰剂、210/3 mg BID、330/6 mg QD；主要终点第 5 周 PANSS 总分较基线变化。原文：\"randomized, double-blind, placebo-controlled trial at 25 US sites\"、\"A total of 307 participants were randomized 1:1:1 to receive either placebo, ML-007C-MA 210/3 mg twice daily, or ML-007C-MA 330/6 mg once daily. The primary endpoint for the trial was the change in PANSS total score from baseline to Week 5.\"（MAN-MPLT-2）。公司称该试验 \"designed and sized to support registration\"（MAN-MPLT-2）。"
comparability = "仅安慰剂对照，无活性对照。与 Cobenfy（BMS）或其他抗精神病药的比较只能是跨试验比较，人群与终点定义可能不同。"
result = "BID 组（mITT）PANSS 总分较安慰剂 -4.5 分，效应量 0.37，p=0.015；完成 5 周者预设分析效应量 0.50（-6.0，p=0.002）；关键次要终点 CGI-S 效应量 0.48（p=0.002）、PANSS 阳性 Marder 因子 0.39（p=0.012）；基线认知受损者认知终点效应量 0.51（p=0.041）。安全性：BID 组 TEAE 74.7% 对安慰剂 48.1%，无严重或药物相关重度不良事件，GI 相关停药 2 例（2.0%）。原文：\"the effect size was 0.50 (LS mean difference from placebo -6.0, p=0.002)\"、\"Clinical Global Impression of Severity (CGI-S) (effect size=0.48; p=0.002)\"、\"TEAEs were reported in 74.7% of participants compared with 48.1% receiving placebo\"、\"rarely associated with discontinuation (two participants, 2.0%)\"（MAN-MPLT-2）。"
limitation = "330/6 mg QD 组主要终点未达显著：\"did not achieve statistical significance on the primary endpoint\"（MAN-MPLT-2）；两个剂量组的多重性校正方案未披露。主要分析为 mITT，非 ITT；完成者分析无缺失值建模但存在选择偏倚。认知终点只在基线认知受损亚组评估，为次要终点。心率小幅升高：\"Small increases in heart rate were observed\"（MAN-MPLT-2）。只有一项阳性 2 期，需 ZEPHYR-2 复制（\"topline results expected in 2028\"，MAN-MPLT-3）。数据只来自公司顶线公告，未见同行评议全文。"
sources = ["MAN-MPLT-2", "MAN-MPLT-3", "CTG-NCT07038876", "NASDAQ-MPLT-2026-10-28"]

