match_note = "ML-007C-MA 是口服 M1/M4 毒蕈碱受体激动剂与外周抗胆碱药的固定剂量复方，用于精神分裂症；原文：\"an oral M1/M4 muscarinic agonist (betovumeline) co-formulated with a peripherally acting anticholinergic (fesoterodine)\"（MAN-MPLT-2）。对应 J&J 画像「精神分裂症的……新机制药物」：10-K 写明现有抗精神病药 \"work primarily by inhibiting dopamine receptors\"（MAN-MPLT-1），本资产走毒蕈碱通路，相对 J&J 现有多巴胺 / 5-HT 类精神分裂症产品为新机制（推断，中）。对应技术行「依从性或安全性差异明确」：原文 \"No fasting requirement and a one-dose titration support a tolerability profile expected to translate into real-world adherence\"（MAN-MPLT-2）、\"99% of patients reaching the target dose\"（MAN-MPLT-3）。组合冲突：10-K 竞争段点名的同类毒蕈碱资产属于 BMS（\"Cobenfy (also known as KarXT), which is currently marketed by Bristol Myers Squibb Company\"）、AbbVie（\"emraclidine, which is being developed by AbbVie Inc.\"）和 Neurocrine；10-K 只在 ASD 易激惹段提到 J&J 的 \"RISPERDAL, marketed by Johnson & Johnson\"（多巴胺拮抗剂，非同机制）（MAN-MPLT-1）。因 AbbVie 已有同适应症毒蕈碱资产，未选 AbbVie。J&J 自有管线未逐项核查，仅以 10-K 竞争段为准。"
thesis = [
  "Johnson & Johnson 需要「抑郁、精神分裂症、神经退行性疾病的快速起效、长效或新机制药物」；MapLight 的 ML-007C-MA（口服 M1/M4 毒蕈碱激动剂 betovumeline + 外周抗胆碱药 fesoterodine 复方，精神分裂症，2 期完成、计划 3 期）对应这一需求，因为它以非多巴胺的毒蕈碱机制起效，且无需空腹、只需一步滴定，契合 J&J「依从性或安全性差异明确」的中枢小分子偏好。",
  "证据是随机双盲安慰剂对照 2 期 ZEPHYR（307 例）210/3 mg BID 组达到主要终点，第 5 周 PANSS 总分较安慰剂改善 4.5 分（效应量 0.37，p=0.015），但 330/6 mg QD 组未达显著，且仅有安慰剂对照，与 Cobenfy 等只能跨试验比较；下一事件是同一资产在阿尔茨海默病精神病适应症上的 2 期 VISTA 顶线结果（2027 年下半年，明确披露）；主要障碍是资金：公司无收入，资金指引只到 2028 年且依赖 2026 年私募款，而精神分裂症注册还需 3 期 ZEPHYR-2；成本不突出（快照 EV < 20 亿美元），权益为公司自有专利，Vanderbilt 引进许可的覆盖范围与许可方义务待确认。",
]
