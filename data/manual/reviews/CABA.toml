[rights]
status = "restricted"
note = "按简报规则（他方持有 ROFN 即为受限）记为 restricted；范围很窄，复核人可改判。rese-cel 的 CD19 结合域为从 IASO 独家引进的全球许可，未见对外授权任何区域；但 IASO 对大中华区独家再许可持有优先谈判权，原文：\"IASO has the right of first negotiation if the Company desires to grant a third party an exclusive license to develop, manufacture, commercialize or otherwise exploit the licensed products in the Greater China region\"（SEC-0001759138-26-000039；10-K 同段 \"IASO has the right of first negotiation if we desire to grant a third party an exclusive license\"，MAN-CABA-1）。全球许可原文：\"we received an exclusive, worldwide license under certain IASO intellectual property to use a novel clinical-stage anti-CD19 binder\"（MAN-CABA-1）。对 IASO 的义务：\"for a total consideration, inclusive of the upfront payment, of up to $162 million, along with tiered mid-single digit royalties on future net sales\"；再许可分成 \"we must pay IASO a low double-digit percentage of any revenue obtained from sublicenses or options to third parties\"；竞业限制 \"agreed, subject to certain exceptions, to refrain from engaging in certain competitive activities\"；IASO 控制专利维护 \"IASO controls such activities for the patent rights licensed to us\"（SEC-0001759138-26-000039 / MAN-CABA-1）；2026 年已付 \"$2.5 million milestone payment to IASO and $0.5 million milestone payment to Oxford after the first patient in a rese-cel pivotal trial was dosed\"（SEC-0001759138-26-000039）。Penn/CHOP 许可：\"total milestone payments could be approximately $21.0 million\"、\"tiered royalties at percentage rates in the low single-digits\"（MAN-CABA-1）。类债务：pack total_debt 为空，但 10-Q 资产负债表有 Lonza 嵌入式融资租赁负债 15,238 + 4,738 千美元（\"Finance lease liabilities, current portion\"，SEC-0001759138-26-000039）。"
sources = ["SEC-0001759138-26-000039", "MAN-CABA-1"]
