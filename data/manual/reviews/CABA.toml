[clinical]
design = "RESET-SSc：开放标签 1/2 期，皮肤严重型与器官受累型各约 6 例平行队列，单次按体重给药 1.0 x 10^6 cells/kg，含氟达拉滨 + 环磷酰胺预处理；原文：\"designed to treat six patients with severe skin manifestations and six patients with severe organ involvement associated with SSc, each in separate parallel cohorts, with a single weight-based dose\"（SEC-0001759138-26-000039）；\"Our RESET TM trials in SLE, myositis, SSc, gMG and PV are designed as open-label trials\"（SEC-0001759138-26-000039）。下一步为约 25 例 SSc 相关 ILD 单臂注册研究，主要终点为 52 周 FVC：\"a single-arm registrational study of approximately 25 patients with SSc-associated ILD using a forced vital capacity (FVC)-based primary endpoint at 52 weeks\"（SEC-0001759138-26-000039）。"
comparability = "无对照组，与标准治疗（免疫抑制剂、对症治疗）无直接或同终点间接比较；任何与已上市药的比较都是跨试验比较，人群与终点定义可能不同。rCRISS 为复合应答指数，注册研究改用 FVC 终点。"
result = "截至 2026-04-16：36 周 rCRISS-25 为 5/6（83%）、rCRISS-50 为 4/6（67%），均在停用全部免疫调节剂、停用或减量激素下；ILD 患者 FVC 预测值中位改善 7.5%（36 周随访者）；原文：\"83% (5/6) of patients achieved revised Composite Response Index in Systemic Sclerosis (rCRISS)-25\"、\"median improvement of 7.5% in patients with 36 weeks of follow-up\"（SEC-0001759138-26-000039）。安全性：\"87% (13/15) of patients experienced either no CRS or transient fever (Grade 1 CRS)\"（SEC-0001759138-26-000039）。"
limitation = "样本极小（rCRISS 6 例），开放标签，会议数据（EULAR 2026），未打开同行评议全文；公司提示早期数据可能不可外推：\"the results from such clinical trials, once completed, may be less reliable than results achieved in larger clinical trials\"（SEC-0001759138-26-000039）。安全性信号：\"93% (14/15) of patients experienced no ICANS (one Grade 3 ICANS previously reported March 2025)\"（SEC-0001759138-26-000039）。需氟达拉滨 + 环磷酰胺预处理，无预处理（PC-free）方案在 SSc 未见数据。"
sources = ["SEC-0001759138-26-000039", "MAN-CABA-2", "CTG-NCT06328777"]

