note = "推断（中高）：10-K 与 10-Q 均未逐字写「全球权益」，也未披露任何对外授权、选择权、优先谈判权或共同开发 / 共同商业化。引进：Biocon 授予含再许可权的许可，原文：\"Biocon would grant us a license, with the right to grant and authorize sublicenses to make, use, sell, offer to sell, import, and otherwise exploit certain fusion protein products of which ficerafusp alfa was the most advanced program\"、\"We have an exclusive license from Biocon Limited to one patent family directed to ficerafusp alfa\"（MAN-BCAX-1）；无后续付款义务：\"there are no future milestone payments, royalty terms or any additional payments required\"（MAN-BCAX-1）；收购时 Biocon 交付义务终止：\"In the event of an acquisition of all or substantially all of our assets and business by a third party, this obligation shall terminate\"（MAN-BCAX-1）。专利：\"Each of the U.S. and foreign patents is expected to expire in 2033\"（MAN-BCAX-1）。MSD 协议仅为 1/1b 期供药合作，联用数据共有：\"jointly owned by both us and MSD\"（MAN-BCAX-1），不构成选择权或共同开发。风险：Y-Trap 发明人更正诉讼涉及许可专利：\"correction of inventorship of a number of patents, including patents alleged to be licensed to us relating to ficerafusp alfa\"、\"On September 30, 2025, the court denied our motion.\"（MAN-BCAX-1）；公司对相关专利发起复审：\"instituted a post-grant review petition brought by the Company against The John Hopkins University\"（SEC-0001628280-26-055765）。债务：10-Q 资产负债表无借款，负债仅应计费用与经营租赁，\"Total liabilities | 43,475\"（千美元，SEC-0001628280-26-055765）；现金跑道：\"sufficient to fund our operations and capital expenditure requirements into the first half of 2029\"（SEC-0001628280-26-055765）。"
sources = ["MAN-BCAX-1", "SEC-0001628280-26-055765"]
