[clinical]
design = "1/1b 期、首次人体、开放标签、多中心研究的 1L R/M HPV 阴性 HNSCC 扩展队列，ficerafusp alfa 750 mg QW（n=30）、1500 mg QW（n=28）、2000 mg Q2W（n=27）联合 pembrolizumab，非随机、无对照；原文：\"a First-in-Human, Phase 1/1b, Open-label, Multicenter Study\"（MAN-BCAX-1）、\"which included the 750mg weekly (QW), 1500mg QW, and 2000mg every-other-week (Q2W) expansion cohorts\"（MAN-BCAX-2）。数据截点 2026-03-31。"
comparability = "跨试验比较，人群与终点定义可能不同：公司把 3 年 OS 与 pembrolizumab 在 HPV 阴性患者中的回顾性分析比较，原文：\"approximately doubling the survival rate observed in retrospective analysis with standard of care pembrolizumab in HPV-negative patients\"、\"No head-to-head studies have been conducted\"（MAN-BCAX-2）。随机、双盲、安慰剂对照的 FORTIFI-HN01（ficerafusp 或安慰剂 + pembrolizumab，约 650 例）尚无疗效读出：\"The total trial will enroll approximately 650 patients\"（MAN-BCAX-1）。"
result = "1500 mg QW 组（关键研究剂量）：确认 ORR 54%，CR 25%，深度缓解（≥80% 缩瘤）80%，中位 DOR 21.7 个月，中位 PFS 9.9 个月，中位 OS 21.3 个月；原文表格值 \"54%\"、\"25%\"、\"80%\"、\"21.7 months\"、\"9.9 months\"、\"21.3 months\"（MAN-BCAX-2）。3 年估计 OS 率 31%：\"showed an estimated OS rate of 31%\"（MAN-BCAX-2）。ORR、CR、深度缓解为替代终点。"
limitation = "单臂、小样本（关键剂量组 n=28），无随机对照疗效数据；会议海报与公司新闻稿，尚无同行评议全文。公司自述安全性：\"a generally well-tolerated safety profile and no new safety signals\"（MAN-BCAX-2），未逐项核查不良事件发生率。深度缓解与长期结局的关联为探索性合并分析：\"Exploratory analyses from multiple expansion cohorts\"（MAN-BCAX-2）。"
