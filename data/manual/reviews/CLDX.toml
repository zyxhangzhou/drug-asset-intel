match_note = "barzolvolimab 是抗 KIT 单抗，清除/抑制肥大细胞，用于皮肤疾病慢性自发性荨麻疹（CSU），并有停药后持续获益数据，对应 BMS 画像中的「持久缓解」「免疫重置」「覆盖皮肤」；原文：\"binding with high specificity to a unique part of the KIT receptor and potently inhibiting its activity\"（MAN-CLDX-1）；\"sustained off-treatment improvement in patients with CSU\"、\"Seven months after the completion of dosing (Week 76), up to 64% of patients treated with barzolvolimab who had angioedema at baseline remained angioedema-free\"、\"shift treatment goals from symptom control to disease modification\"（MAN-CLDX-2）。停药后数据来自 2 期长期随访（EAACI 会议），属公司表述。组合冲突仅按 10-K 竞争表（只列已启动 3 期或已上市的竞品）核查：表中 CSU 竞品无 BMS 产品（Novartis 有 Xolair 与 remibrutinib），未核查 BMS 早期管线。"
thesis = [
  "Bristol Myers Squibb 需要「能带来持久缓解、组织修复或免疫重置的自身免疫药物，覆盖皮肤」；Celldex 的 barzolvolimab（抗 KIT 单抗、抑制肥大细胞，慢性自发性荨麻疹，3 期已读出）对应这一需求，因为它在 CSU 中显示停药 7 个月后仍有最多 64% 基线伴血管性水肿患者无血管性水肿，公司称可能把治疗目标从症状控制转向疾病修饰。",
  "证据是两项随机双盲安慰剂对照 3 期 EMBARQ-CSU1/2（共 1,939 例）均达到第 12 周 UAS7 主要终点（150 mg Q4W 较基线 -20.2 对安慰剂 -10.7/-11.4，p<.00001），但无与 omalizumab 等标准治疗的直接对比；下一事件是向 FDA 提交 BLA（2027 年，公司只披露年份，按估算处理）；主要障碍是成本：快照 EV 约 16.1 亿美元（<20 亿档），获批时另须付 Kolltan 原股东 5,250 万美元，并向 Yale 支付低个位数销售特许权使用费。",
]
