[clinical]
design = "EMBARQ-CSU1/2：随机、双盲、安慰剂对照、平行组、全球 3 期，H1 抗组胺药控制不佳的成人 CSU（含既往高级治疗经治/难治者），1,939 例按 1:1:1 随机到 150 mg Q4W、300 mg Q8W 或安慰剂 24 周；原文：\"randomized, double-blind, placebo-controlled, parallel group, global studies. 1,939 patients were randomized (n=963 EMBARQ-CSU1; n=976 EMBARQ-CSU2)\"、\"barzolvolimab 300 mg every 8 weeks (following 450 mg loading dose)\"（MAN-CLDX-1）。"
comparability = "只有安慰剂对照；与 omalizumab、remibrutinib、dupilumab 等无直接对比。omalizumab 难治亚组是亚组分析，不是头对头。任何与已上市药的比较都是跨试验比较，人群与终点定义可能不同；公司「best-in-disease」为公司表述。"
result = "第 12 周 UAS7 LS 均值变化：CSU1 150 mg Q4W -20.2、300 mg Q8W -20.5、安慰剂 -10.7；CSU2 分别 -20.2、-19.7、-11.4，均 p<.00001；原文：\"-20.2 (0.64) (p<.00001)\"、\"-10.7 (0.65)\"（MAN-CLDX-1）。第 12 周完全缓解（UAS7=0）42.1%–45.7% 对安慰剂 9.3%/12.6%：\"42.4% (p<.00001)\"、\"45.7% (p<.00001)\"（MAN-CLDX-1）。"
limitation = "仅为公司顶线新闻稿，尚无同行评议全文；52 周治疗仍在进行：\"treatment continuing through 52 weeks\"（MAN-CLDX-1）。同一资产在结节性痒疹 2 期失败：\"the trial did not meet primary or key secondary endpoints\"（MAN-CLDX-2）。KIT 抑制类效应：\"hair color changes\"、\"taste changes\"（MAN-CLDX-3）；非人灵长类毒理 \"a profound impact on spermatogenesis, an expected and well understood effect of KIT inhibition\"（MAN-CLDX-3）。"
sources = ["MAN-CLDX-1", "MAN-CLDX-2", "MAN-CLDX-3", "CTG-NCT06445023", "CTG-NCT06455202"]

