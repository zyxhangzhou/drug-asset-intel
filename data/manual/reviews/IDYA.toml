match_note = "需求条目中的「靶向小分子」→ darovasertib 是口服、选择性 PKC 抑制剂，按 GNAQ/11 驱动机制开发；原文：\"Darovasertib is an oral, potent and selective small molecule inhibitor of protein kinase C\"（SEC-0001193125-26-332774）。联用药 crizotinib 是 Pfizer 自有产品，双方有临床供药协议；原文：\"darovasertib in combination with crizotinib, Pfizer’s oral c-MET inhibitor\"、\"Pfizer supplies the Company with their MEK inhibitor, binimetinib, and their cMET inhibitor, crizotinib\"（SEC-0001193125-26-332774）。不足：葡萄膜黑色素瘤不在 Pfizer 画像点名的乳腺、肺、泌尿、血液肿瘤之列，也不对应 Pfizer 的 LOE 产品，因此只算治疗领域 + 技术类型匹配。组合冲突只按 IDEAYA 10-K 竞争段核查：mUM 竞品名单为 Replimune、iOnctura、Novartis（DYP688）、Immatics、Aura、Immunocore，不含 Pfizer；原文：\"we are not aware of other companies actively developing clinical-stage therapeutics directed to PKC as a target for solid tumors\"（MAN-IDYA-1）。"
thesis = [
  "Pfizer 需要「ADC、双特异抗体、靶向小分子或放射性药物」类肿瘤资产（Phase 2b-注册期）；IDEAYA 的 darovasertib（口服 PKC 抑制剂，与 Pfizer 的 crizotinib 联用，一线 HLA-A*02:01 阴性转移性葡萄膜黑色素瘤，注册性 2/3 期已达主要终点、NDA 滚动提交中）对应这一需求，因为它是生物标志物明确的口服靶向小分子，且联用药就是 Pfizer 自有的 crizotinib；但该适应症不在 Pfizer 画像点名的瘤种内。",
  "证据是随机 2/3 期 OptimUM-02（n=313，2:1）BICR 评估 PFS 6.9 个月 vs 3.1 个月（HR 0.42，p<0.0001），对照为真实世界的研究者选择治疗（约 76% ipi+nivo、24% pembrolizumab），3 期部分的主要终点总生存尚不成熟；下一事件是完成 NDA 提交（2026 年下半年，明确披露），总生存预设中期分析在 2027 年年中；主要障碍是权益：美国以外权益已独家许可给 Servier（并享有美国单独许可 / 出售的优先谈判权，但不适用于公司整体并购），且需向 Novartis 支付中至高个位数特许权使用费；快照 EV 约 20.3 亿美元，无借款，现金指引可支撑至 2030 年。",
]
thesis_sources = ["PFE-1", "PFE-3", "SEC-0001193125-26-332774", "MAN-IDYA-1", "MAN-IDYA-2", "MAN-IDYA-3", "MAN-IDYA-4", "MAN-IDYA-5", "MAN-IDYA-6", "NASDAQ-IDYA-2026-10-28", "CTG-NCT05987332"]

