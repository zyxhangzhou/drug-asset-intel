[rights]
status = "partial"
note = "事实：美国以外全部区域已独家许可给 Servier，IDEAYA 保留美国全部权益；10-Q 原文：\"to develop and commercialize products in all countries worldwide except for the United States\"、\"The Company retains all rights to darovasertib in the United States.\"（SEC-0001193125-26-332774）；10-K 原文：\"We retain all rights to darovasertib in the United States.\"（MAN-IDYA-1）。Servier 方面另有：\"The Company and Servier will collaborate on the development of darovasertib and share the associated costs\"（SEC-0001193125-26-332774），本草稿把它读作区域许可下的共同开发分担，不是美国共同商业化（推断，中）。许可协议正文（MAN-IDYA-6，10-Q/10-K 正文未披露）：Servier 对美国区域的单独许可 / 出售持有优先谈判权（ROFN），原文：\"grant a license under the Licensed IP to a Third Party to Develop, Manufacture, Commercialize or otherwise Exploit the Licensed Compound or any Licensed Product outside the Territory ( i.e. in the U.S.)\"；但并购 / 控制权变更除外：\"other than (x) in connection with any merger, consolidation, sale of substantially all of IDEAYA’s assets or business\"；控制权变更只需通知并设防火墙：\"IDEAYA shall promptly notify Licensee in writing upon the execution of a definitive agreement providing for a Change of Control of IDEAYA\"；\"Post-ROFN Protection . [***]\" 内容被涂黑，未知。因此整体收购不受 ROFN 阻挡，但单独许可美国权益会触发 ROFN（推断，中高）。引进义务：darovasertib 从 Novartis 引进，\"subject to certain economic obligations pursuant to its exclusive, worldwide license to darovasertib with Novartis\"；剩余里程碑 \"up to $ 8.0 million\"（开发 / 监管）与 \"up to $ 20.0 million\"（销售），另付 \"mid to high single-digit tiered royalty payments\"（SEC-0001193125-26-332774）。联用药 crizotinib 只有临床供药协议，无商业权益安排。无借款：10-Q 资产负债表负债只有应付账款、应计费用与经营租赁负债，总负债 110,794 千美元（SEC-0001193125-26-332774）。"
sources = ["SEC-0001193125-26-332774", "MAN-IDYA-1", "MAN-IDYA-6"]
