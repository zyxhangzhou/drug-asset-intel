[clinical]
design = "OptimUM-02：全球、多中心、开放标签、随机 2/3 期，一线 HLA-A*02:01 阴性转移性葡萄膜黑色素瘤；2b 部分 darovasertib 300 mg BID + crizotinib 200 mg BID（n=210）对研究者选择治疗（n=103），按 2:1 随机，主要终点为 BICR 评估的 PFS，3 期部分主要终点为 OS；原文：\"Phase 2/3, multi-center, multi-arm, multi-stage, open-label study\"、\"Primary: PFS by BICR\"（MAN-IDYA-3）；\"randomized 2:1 to darovasertib in combination with crizotinib\"（MAN-IDYA-4）。"
comparability = "与标准治疗直接随机对照：对照臂 76%（n=78）ipilimumab+nivolumab、24%（n=25）pembrolizumab，无患者接受 dacarbazine；原文：\"The ICT arm was composed of 76% (n=78) ipilimumab plus nivolumab (anti-CTLA-4/PD-1) and 24% (n=25) pembrolizumab (anti-PD-1)\"（MAN-IDYA-2）。该人群无获批疗法：\"Currently no FDA-approved treatments for HLA-A*02:01 negative mUM patients\"（MAN-IDYA-3）。与 tebentafusp（Kimmtrak，仅限 HLA-A*02:01 阳性）没有直接比较，人群不同。"
result = "BICR 评估中位 PFS 6.9 个月 vs 3.1 个月，HR 0.42（95% CI 0.30–0.59，p<0.0001）；ORR 37.1% vs 5.8%；中位 DOR 6.8 个月；原文：\"achieved a statistically significant improvement in median PFS of 6.9 months versus 3.1 months in the ICT arm\"、\"ORR by BICR in the darovasertib combination and ICT arm was 37.1% and 5.8%\"、\"The median DOR in the darovasertib combination arm was 6.8 months\"（MAN-IDYA-2）。"
limitation = "开放标签；中位随访仅 7.4 个月（\"Median follow-up for the population was 7.4 months\"，MAN-IDYA-3）；OS 未成熟，预设中期分析在 2027 年年中（\"pre-specified interim analysis expected in mid-2027\"，MAN-IDYA-4）。只覆盖 HLA-A*02:01 阴性人群；阳性人群为单臂 2 期 OptimUM-01。毒性负担较高：腹泻 84.9%、3/4 级 TRAE 40.6%，crizotinib 因 TRAE 停药 10.0%；原文：\"Diarrhea 203 ( 84.9)\"、\"Grade 3 or 4 97 (40.6) 37 (37.0)\"、\"Leading to crizotinib withdrawn 24 (10.0)\"（MAN-IDYA-3）。只有新闻稿与会议海报，未见同行评议全文。"
sources = ["MAN-IDYA-2", "MAN-IDYA-3", "MAN-IDYA-4", "CTG-NCT05987332"]

