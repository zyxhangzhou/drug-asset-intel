[clinical]
design = "多中心 1/2 期开放标签单臂研究，47 例 MPS II 儿童（ERT 初治 15 例、既往治疗 32 例）；主要目的为安全性与耐受性，次要终点为脑脊液与尿液 HS、适应行为、肝脏体积。原文：\"The study evaluated treatment in 47 ERT-naïve (n=15) and previously treated (n=32) study participants\"（MAN-DNLI-1）。确证性 2/3 期 COMPASS 为 2:1 随机对照 idursulfase，原文：\"The participants are randomized 2:1 to receive either tividenofusp alfa or idursulfase, respectively\"（MAN-DNLI-1）。"
comparability = "无直接对比：1/2 期为单臂，与 idursulfase 的随机对比（COMPASS）尚未读出；当前疗效证据为与基线比较的替代终点。原文：\"continued approval is contingent upon confirmation of clinical benefit in the ongoing global Phase 2/3 COMPASS trial\"（SEC-0001714899-26-000097）。"
result = "脑脊液 HS 第 24 周较基线下降 91%，原文：\"reduced from baseline by 91% (95% CI, 90% to 92%; N=44) at Week 24\"；93% 受试者达非 MPS II 儿童范围，原文：\"At Week 24, 93% of study participants reached levels within the range of children without MPS II\"；血清 NfL 第 153 周下降 76%，原文：\"At Week 153, NfL was reduced by 76% (95% CI, 68% to 82%; N=13)\"（MAN-DNLI-1；10-K 引述 Muenzer et al., NEJM, 2026）。"
limitation = "替代终点（加速批准）；单臂、样本量小；长期数据 N 递减（第 153 周 N=16 / 13）；贫血与输注反应需关注，原文：\"The most common treatment-related adverse events were infusion-related reactions\"（MAN-DNLI-1）。获批人群限于儿童，原文：\"pediatric patients weighing at least 5 kg prior to advanced neurologic impairment\"（SEC-0001714899-26-000097）。"
sources = ["MAN-DNLI-1", "SEC-0001714899-26-000097"]

