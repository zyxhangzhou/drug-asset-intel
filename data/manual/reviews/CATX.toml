[rights]
status = "restricted"
note = "最新 10-Q 写明 Lantheus 持有 VMT-α-NET 全球独家许可的独家谈判选择权，谈判失败后第三方报价时仍有一年重新进入谈判权：\"Lantheus was granted an exclusive option to negotiate an exclusive, worldwide, royalty- and milestone-bearing right and license to [ 212 Pb]VMT-α-NET\"、\"Lantheus has a one-year right to reenter negotiations if a third party offers to purchase or license\"（SEC-0001193125-26-342512）。该选择权未见到期：资产负债表 \"Deferred Income (Note 3)\" 在 2026-06-30 与 2025-12-31 均为 26,600 千美元，期权负债\"will be recognized as income ... as the various options expire\"；已到期的只有公司层面的优先要约与最后一看权：\"right of first offer and last look protections ... which expired on January 8, 2025\"（SEC-0001193125-26-342512）。因此全资收购方案不成立，推荐交易形式取许可，且第三方许可本身会触发 Lantheus 的重新谈判权。引进义务：资产专利由 University of Iowa 独家许可：\"we have exclusively in-licensed from the University of Iowa patents and patent applications\"；\"The UIRF License is a royalty-bearing license\"，并须分成再许可收入：\"share a percentage of our proceeds that we derive from other agreements, like sublicense agreements\"（MAN-CATX-2）。其他：Lantheus 2024 年认购 \"19.99 % of the outstanding shares of Common Stock as of January 8, 2024\"，并有 ATM 参与权；债务为 Coralville 房产抵押票据，\"a balloon payment of approximately $ 1.5 million is due on December 29, 2027\"（SEC-0001193125-26-342512）。"
sources = ["SEC-0001193125-26-342512", "MAN-CATX-2"]
