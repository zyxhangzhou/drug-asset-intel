match_note = "[212Pb]VMT-α-NET（bamzireotide navoxetan）是靶向 SSTR2、递送 α 核素 212Pb 的放射性靶向药，对应 J&J 第 1 治疗领域画像中的「放射性靶向药」；原文：\"to target somatostatin receptor type 2 (SSTR2), a protein that is overexpressed in neuroendocrine tumors (NETs) and other cancers, and to deliver the alpha-emitting radioisotope 212 Pb to tumor sites expressing SSTR2\"（SEC-0001193125-26-342512）。组合冲突按 10-K 竞争段核查：NET 放射性配体竞品只列 Novartis（Lutathera）与 \"ITM, Bristol Myers Squibb (through its acquisition of RayzeBio), Eli Lilly (through its acquisition of POINT Biopharma) and Sanofi\"，无 J&J；J&J 只出现在 α 放射性药物开发者的泛列名单中（\"Convergent Therapeutics, Johnson & Johnson, ARTBIO and Abdera\"，未写适应症）（MAN-CATX-2）。J&J 画像列出的适应症以血液瘤为主，未点名 NET；10-K 之外的 J&J 管线未核查组合冲突。"
thesis = [
  "Johnson & Johnson 需要「BCMA及下一代血液瘤靶点、双特异抗体、ADC和放射性靶向药」；Perspective 的 VMT-α-NET（SSTR2 靶向 212Pb α 放射性配体，SSTR2 阳性神经内分泌肿瘤，1/2a 期、计划 2027 年启动 3 期）对应这一需求，因为它是放射性靶向药，且 10-K 列出的 NET 放射性配体竞品（Novartis、BMS、Lilly、Sanofi、ITM）中没有 J&J。",
  "证据是单臂 1/2a 期剂量递增/扩展试验的中期数据：ORR（含未确认缓解）队列 2 为 33%（n=46）、队列 3 为 50%（n=20），全体 18 个月 PFS 率 72%，无 DLT 与 4/5 级 TEAE，但无对照组，与 Lutathera 等标准治疗无直接比较；下一事件是 NET 3 期启动（2027 年，公司只披露年份，按估算处理）；主要障碍是权益：Lantheus 持有就 VMT-α-NET 全球独家许可进行独家谈判的选择权，第三方报价时还可在一年内重新进入谈判。",
]
thesis_sources = ["JNJ-1", "JNJ-2", "MAN-CATX-1", "MAN-CATX-2", "SEC-0001193125-26-342512", "CTG-NCT05636618"]

