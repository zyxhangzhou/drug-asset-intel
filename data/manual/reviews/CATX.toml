[clinical]
design = "多中心、开放标签、剂量递增与剂量扩展 1/2a 期（NCT05636618），入组未接受过放射性药物治疗的不可切除或转移性 SSTR2 阳性肿瘤患者；ESMO 2026 分析 68 例（队列 1 2.5 mCi n=2、队列 2 5.0 mCi n=46、队列 3 6.0 mCi n=20，每 8 周最多 4 次）；原文：\"multi-center, open-label, dose-escalation and dose-expansion study (clinicaltrials.gov identifier NCT05636618)\"、\"ESMO presentation based on analysis of 68 patients across three dose cohorts\"（MAN-CATX-1）。"
comparability = "单臂试验，无对照组；与 Lutathera（177Lu，SSTR2 阳性 GEP-NET 已上市）等标准治疗无直接比较。任何与已上市药的比较都是跨试验比较，人群与终点定义可能不同；本复核未打开 Lutathera 标签，不给比较数值。公司「best-in-class」为公司表述：\"reinforce the potential of VMT-α-NET to achieve a best-in-class profile\"（MAN-CATX-1）。"
result = "ORR（含未确认）队列 2 为 33%（15/46）、队列 3 为 50%（10/20）；全部 SSTR2 阳性靶病灶的 GEP-NET 亚组 37%（14/38）与 47%（8/17）；DCR 89% 与 95%；全体 PFS 率 6 个月 86%、12 个月 74%、18 个月 72%；原文：\"15 of 46 (33%)\"、\"10 of 20 (50%)*\"、\"PFS rate was 86% at six months, 74% at 12 months, and 72% at 18 months across Cohorts 1, 2, and 3\"（MAN-CATX-1）。安全性：\"No dose-limiting toxicities (DLTs), Grade 4 or 5 treatment-emergent adverse events (TEAEs), or adverse event-related treatment discontinuations were reported\"；3 级 TEAE \"20 out of 68 patients, or 29%\"（MAN-CATX-1）。"
limitation = "公司新闻稿中期数据，尚无同行评议全文；队列 3 的 10 例缓解中只有 6 例确认：\"Five of those responses were confirmed as of September 2, 2026, and an additional response was confirmed as of September 10, 2026\"（MAN-CATX-1）。ORR 与 PFS 率为单臂结果，NET 注册终点需 3 期验证。肾脏安全性仍在随访：\"Two patients (2.9%) had Grade 3 renal events, and renal function continues to be characterized over longer follow-up\"（MAN-CATX-1）。"
sources = ["MAN-CATX-1", "CTG-NCT05636618"]

