note = "最新 10-Q 写明无合作：\"We currently do not have strategic collaborations in place for clinical development of any of our current drug candidates.\"（MAN-VKTX-2）；公司称 VK2735 \"wholly owned\"（MAN-VKTX-3）。Ligand 主许可协议只覆盖 TRß、SARM、FBPase、DGAT-1、EPOR 化合物（\"Ligand granted to us and our affiliates an exclusive, perpetual, irrevocable, worldwide, royalty-bearing right and license\"，MAN-VKTX-1），未列 GLP-1/GIP；10-K 专利段写明 GLP-1 项目专利为公司自有：\"for our GLP-1 program, we own three U.S. patents\"（MAN-VKTX-1）。故推断 VK2735 不是自 Ligand 引进，不欠 Ligand 里程碑或个位数特许权使用费（推断，中高；文件未逐字写明 VK2735 不在许可内）。注意 10-K 风险因素泛称 \"Most of the intellectual property related to our drug candidates is currently owned by Ligand\"（MAN-VKTX-1），与上述按项目的表述有张力，签核时请人工确认。Ligand 于 2026-04-24 主张终止 TR-Beta 项目（VK2809、VK0214）许可并起诉，只涉及 VK2809/VK0214：\"The TR-Beta Program includes our VK2809 and VK0214 product candidates.\"（MAN-VKTX-2）。"
sources = ["MAN-VKTX-1", "MAN-VKTX-2", "MAN-VKTX-3"]
