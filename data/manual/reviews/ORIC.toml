match_note = "rinzimetostat 是口服 PRC2（EED 亚基）变构抑制剂，属实体瘤靶向小分子；公司称其安全性有明确差异，并列出前列腺癌以外的扩展方向，对应 AbbVie 画像中的「靶向小分子」「明确差异化」「可扩适应症」；原文：\"an allosteric inhibitor of the polycomb repressive complex 2 (PRC2) via the EED subunit, being developed for prostate cancer\"（MAN-ORIC-2）；\"demonstrates a clearly differentiated safety profile\"、\"Several Development Opportunities in Other Solid Tumors\"（MAN-ORIC-3）。「差异化」是公司基于 1b 期跨试验比较的表述，不是已证实结论。买方选择：Pfizer（第 2 治疗领域，画像含「泌尿」，Xtandi 2027 LOE）文字契合度最高，但存在组合冲突：10-K 竞争段 \"we are aware of several companies developing inhibitors against PRC2 via EZH2 inhibition that are currently in clinical trials, including Ipsen, Novartis, Daiichi Sankyo, Pfizer\"（MAN-ORIC-1）；MEVPRO-1 为 mevrometostat（EZH2 抑制剂）联合 enzalutamide 的 3 期，入组 \"≥12 weeks of prior abiraterone treatment\"，主要终点 rPFS，作者含 \"Employee of and shareholder in Pfizer Inc.\"（MAN-ORIC-4），与 Himalayas-1 同机制通路、同人群，故排除 Pfizer；Novartis 同在 10-K 竞品名单中，亦排除。AbbVie 不在 10-K 竞品名单中；AbbVie 自身前列腺癌 / PRC2 布局未核查（未核查组合冲突）。"
thesis = [
  "AbbVie 需要「血液瘤和实体瘤…靶向小分子，要求明确差异化和可扩适应症」；ORIC 的 rinzimetostat（PRC2/EED 变构抑制剂，口服每日一次，阿比特龙治疗后的转移性去势抵抗性前列腺癌 mCRPC，3 期 Himalayas-1 已启动）对应这一需求，因为公司 1b 期数据显示 400 mg 联合 darolutamide 的 3 级以上治疗相关不良事件 6%，并规划向其他实体瘤扩展。",
  "证据是 1b 期剂量优化数据（阿比特龙治疗后 400 mg + darolutamide：确认 PSA50 5/15、33%，5 个月 rPFS 里程碑率 84%，中位随访 4.9 个月，rPFS 尚不成熟，与 mevrometostat 等的比较均为跨试验比较）；下一事件是 Himalayas-1 主要终点 rPFS 读出（2028-03，估算；公司另披露 2026 下半年项目更新）；主要障碍不突出：公司持有全球权益（Mirati 引进许可免特许权使用费、无里程碑），无借款，快照 EV 约 5.8 亿美元，现金预计支撑至 2028 下半年，主要风险在于 Pfizer 的同通路 EZH2 抑制剂已在同一人群做 3 期。",
]
