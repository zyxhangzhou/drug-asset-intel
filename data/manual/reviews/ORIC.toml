[clinical]
design = "1b 期、多中心、开放标签试验（NCT05413421），rinzimetostat 每日一次联合 darolutamide 或 apalutamide，入组既往接受过 AR 通路抑制剂的 mCRPC；剂量优化部分阿比特龙治疗后患者 400 mg QD + darolutamide n=18；原文：\"Phase 1b, Multicenter, Open-Label Trial (in Collaboration with Bayer and Johnson & Johnson)\"、\"Primary endpoints: Safety and Recommended Phase 3 Dose\"（MAN-ORIC-3）。"
comparability = "无对照组；公司幻灯片把 rinzimetostat 与 mevrometostat + enzalutamide、enzalutamide 单药的已发表数据并列，属跨试验比较，人群与终点定义可能不同；原文：\"Cross-trial comparison in previously treated mCRPC patients shown\"、\"Competitor rPFS percentages estimated from published data\"（MAN-ORIC-3）。"
result = "阿比特龙治疗后 400 mg QD + darolutamide：PSA50 未确认 7/15（47%）、确认 5/15（33%）；rPFS 里程碑率 3 个月 93%、4 个月 84%、5 个月 84%（中位随访 4.9 个月）；3 级以上治疗相关不良事件 6%，无剂量下调；原文：\"PSA50 7/15 (47%) 5/15 (33%)\"、\"3-Month 93%\"、\"Grade ≥3 TRAEs 36% 49% 6%\"（MAN-ORIC-3）。疗效数据截止 2026-03-06：\"ORIC data on file as of March 6, 2026\"（MAN-ORIC-3）。"
limitation = "样本小（n=18），随访短，rPFS 不成熟（\"Radiographic Progression-Free Survival Data Are Immature\"），PSA 为替代指标；数据仅见公司幻灯片（8-K 附件），无同行评议全文。竞争：Pfizer 的 EZH2 抑制剂 mevrometostat 在同一阿比特龙治疗后 mCRPC 人群做 3 期 MEVPRO-1（\"MEVPRO-1 will include ~600 patients with ≥12 weeks of prior abiraterone treatment\"，MAN-ORIC-4），进度可能领先。"
sources = ["MAN-ORIC-3", "MAN-ORIC-4", "CTG-NCT05413421"]

