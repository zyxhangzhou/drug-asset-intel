note = "事实：10-Q：\"The Company will conduct and sponsor the Himalayas-1 trial and maintain full economic ownership and control of rinzimetostat.\"（SEC-0001193125-26-330631）；10-K：\"We own or license full worldwide development and commercialization rights to each of our programs (other than with respect to our brain-penetrant EGFR program, enozertinib\"（MAN-ORIC-1）；Bayer 供药协议 \"does not grant Bayer any license, option, or other rights to\" rinzimetostat（MAN-ORIC-2）。引进许可：rinzimetostat 由 Mirati（现为 BMS 子公司）许可，\"Mirati granted the Company a worldwide, exclusive, sublicensable, royalty-free license\"、\"The Company is not obligated to pay Mirati milestones or royalties.\"、\"The Mirati License Agreement continued in effect upon consummation of the transaction\"（SEC-0001193125-26-330631）。终止时须返还：\"obligated to assign to Mirati, or grant an exclusive license to Mirati\"（MAN-ORIC-1）；Mirati 可在 \"discontinues development of licensed products for a specified period of time\" 时终止（SEC-0001193125-26-330631）。许可协议是否含控制权变更 / 转让限制条款未见披露（待核实）。J&J 与 Bayer 协议仅为供药合作。无借款：10-Q 资产负债表负债只有应付账款、应计负债与其他长期负债，\"Total liabilities 23,429\"（千美元，SEC-0001193125-26-330631）。"
sources = ["SEC-0001193125-26-330631", "MAN-ORIC-1", "MAN-ORIC-2"]
