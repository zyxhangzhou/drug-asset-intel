status = "full"
note = "事实：10-K Item 1 原文 \"We have worldwide rights to our proprietary platform and to all of our product candidates.\"（MAN-SRRK-1）。既往合作均已终止：Gilead \"agreed the option exercise period for all programs under the Gilead Agreement had been terminated as of January 6, 2022\"；Janssen 许可 \"the license agreement was terminated in July 2022\"（MAN-SRRK-1，仅涉及 GARP-TGFβ 专利族）。引进许可：Adimab 协议对行权产品收取 \"a low-to-mid single-digit percentage of annual worldwide net sales\" 及每产品不超过 \"mid-teen millions\" 的里程碑，10-K 只点名 \"SRK-181 is subject to the terms of the Adimab Agreement\"，apitegromab 是否受其约束待核实；10-K 附件清单另有 \"Exclusive License Agreement by and between the Registrant, and Children’s Medical Center, dated as December 16, 2013\"，正文未描述，是否涉及 apitegromab 及其许可费待核实（MAN-SRRK-1）。最新 10-Q 检索 worldwide / royalt / license agreement 未见新的授权出去条款（SEC-0001193125-26-336732）。债务：Blue Owl 定期贷款，\"To date, the Company has received $ 200.0 million of Term Loans\"，\"The maturity date of the Term Loan is the earlier of February 26, 2032\"，获批后另有不超过 1.5 亿美元延迟提款额度（SEC-0001193125-26-336732）。资金指引：\"will enable us to fund our operating expenses and capital expenditure requirements into the second half of 2027\"（SEC-0001193125-26-336732）；另有 2 亿美元 ATM：\"aggregate offering price of up to $200,000,000\"（MAN-SRRK-5）。"
sources = ["MAN-SRRK-1", "SEC-0001193125-26-336732", "MAN-SRRK-5"]
