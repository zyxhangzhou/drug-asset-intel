[clinical]
design = "EMBRAZE：随机、双盲、安慰剂对照 2 期概念验证，100 例 18–65 岁超重（BMI≥27 且至少一项合并症）或肥胖（BMI≥30）非糖尿病受试者，全部使用 tirzepatide，1:1 随机加用 apitegromab 10 mg/kg 或安慰剂，每 4 周静脉输注，治疗 24 周。原文：\"randomized, double-blind, placebo-controlled, Phase 2 proof-of-concept trial\"、\"The enrollment of EMBRAZE included 100 subjects aged 18-65 who were overweight or living with obesity without diabetes\"、\"The primary endpoint was change from baseline at Week 24 in lean mass assessed by dual-energy X-ray absorptiometry\"（MAN-SRRK-2）。"
comparability = "组内对照为 tirzepatide + 安慰剂，属与标准减重药的直接加药对比，原文：\"all subjects received tirzepatide\"（MAN-SRRK-2）；未与 semaglutide 或其他肌肉保留候选药对比，任何与其他 myostatin/activin 通路药物的比较都是跨试验比较，人群与终点定义可能不同。"
result = "瘦体重变化 -1.6 kg（联合组，n=43）对 -3.5 kg（tirzepatide 单药，n=44），差 1.9 kg，p=0.001，即保留 54.9% 瘦体重；减重中瘦体重占比 14.6% 对 30.2%；脂肪减少 8.5 kg 对 8.0 kg；体重下降 12.3% 对 13.4%。原文：\"54.9% preservation\"、\"Patients receiving apitegromab with tirzepatide over 24 weeks lost 12.3% of body weight while those on tirzepatide alone lost 13.4% of body weight\"、\"No subjects experienced serious adverse events (SAEs) or discontinuations considered to be related to apitegromab treatment\"（MAN-SRRK-2）。"
limitation = "替代终点，无肌力、体能或心代谢结局数据；仅 24 周；分析只含完成治疗并有第 24 周 DEXA 的受试者（\"Analysis based on participants who completed treatment\"，MAN-SRRK-2），非 ITT；联合组总减重略少；静脉每 4 周给药不适合大规模肥胖人群；数据仅来自公司顶线新闻稿，未见同行评议全文；SMA 标签有骨折警示（\"Fractures occurred in 9% of patients treated with ISEMBYLD 10 mg/kg vs. 2% in placebo\"，MAN-SRRK-4），在肥胖人群中的骨安全性未知。"
sources = ["MAN-SRRK-2", "MAN-SRRK-4", "CTG-NCT06445075"]

