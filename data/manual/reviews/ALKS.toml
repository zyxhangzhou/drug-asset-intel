design = "2 期 Vibrance-1（NCT06358950）：随机、双盲、安慰剂对照、剂量探索，NT1 成人 92 例，每日一次 4/6/8 mg 或安慰剂，6 周；原文：\"The randomized, placebo-controlled, six-week, double-blind phase 2 study conducted in 92 patients with NT1\"（MAN-ALKS-2）。"
comparability = "仅有安慰剂对照；与 sodium oxybate、pitolisant、solriamfetol 等现有疗法没有直接对比。任何与其他药物（含其他 OX2R 激动剂）的比较都是跨试验比较，人群与终点定义可能不同；6 周疗程短于注册试验。"
result = "主要终点在全部剂量达到：第 6 周 MWT 平均睡眠潜伏期较安慰剂（LSM 差）4 mg 22.2 分钟（p=0.01）、6 mg 24.1、8 mg 26.0 分钟（p<0.0001，见新闻稿终点表）；原文：\"Once-daily alixorexton met the primary endpoint across all doses tested\"、\"All alixorexton dose groups achieved normative wakefulness on the MWT (mean sleep latency ≥20 minutes)\"（MAN-ALKS-2）。关键次要终点 ESS 改善；猝倒率只在 6 mg 显著：\"achieved statistical significance at the 6 mg dose\"（MAN-ALKS-2）。安全性：\"No serious treatment-emergent adverse events (TEAEs) were reported.\"（MAN-ALKS-2）。"
limitation = "2 期疗程仅 6 周、样本 92 例；数据来自公司新闻稿（World Sleep 2025 口头报告），未打开同行评议全文。NT2 的 Vibrance-2 两个主要终点只在部分剂量达到统计学显著：\"Based on the pre-specified analysis, the 14 mg and 18 mg doses achieved statistical significance\"（MWT）、\"the 18 mg dose achieved statistical significance\"（ESS）（MAN-ALKS-3）。常见不良事件含尿频、失眠、视物模糊：\"were pollakiuria, insomnia, salivary hypersecretion, urinary urgency and blurred vision\"（MAN-ALKS-2）。"
sources = ["MAN-ALKS-2", "MAN-ALKS-3", "CTG-NCT06358950"]

