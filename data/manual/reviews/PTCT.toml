note = "推断（中高）：10-K 写明 \"We do not license any material patent rights relating to sepiapterin to unaffiliated parties.\"，物质组成专利 \"The last issued U.S. patent relating to composition of matter is currently scheduled to expire in September of 2038.\"（MAN-PTCT-1）。10-K 与最新 10-Q 未出现 sepiapterin 的对外许可、选择权或共同商业化；文件没有逐字写「全球权益」，故为推断。引进与付款义务：(1) Shiratori 制造工艺许可，\"we are obligated to pay to Shiratori a low single digit percentage of annual net sales of the Sepiapterin Products\"（MAN-PTCT-1）；(2) Censa 并购或有对价，第三季度又触发 \"net sales milestone payment to the former Censa securityholders\"（5,000 万美元），且 \"The former Censa securityholders may also be entitled to receive other contingent payments\"（MAN-PTCT-2）。公司在美、欧、拉美、日本自行商业化：\"our commercialization efforts in the United States, the EEA, Latin America, Japan and other territories\"（MAN-PTCT-2）；10-K 所述第三方仅为经销商（\"Our third-party distributors act as intermediaries between us and end-users\"，MAN-PTCT-1），不是区域许可。公司层面：votoplam 已许可 Novartis，PTC 保留 \"a 40% share of U.S. profits and losses\"（MAN-PTCT-2）；债务为 2031 年到期 0% 可转债 5.5 亿美元，\"The 2031 Convertible Notes will mature on June 15, 2031\"（MAN-PTCT-2）；另有 Royalty Pharma 特许权使用费融资按债务入账，2026-09-30 余额约 23.06 亿美元，原文：\"these fundings should be classified as debt\"，PTC 已出售 \"100 % of the Company's rights to receive sales-based royalty payments on worldwide net sales of Roche’s Evrysdi\"（MAN-PTCT-2），收购方拿不到 Evrysdi 特许权现金流；该负债未计入 pack 的 total_debt（5.91 亿美元）。资金：\"will be sufficient to fund its operations for at least the next twelve months\"（MAN-PTCT-2），公司称 \"on track to achieve our cash flow breakeven milestone this year\"（MAN-PTCT-3）。"
sources = ["MAN-PTCT-1", "MAN-PTCT-2", "MAN-PTCT-3", "SEC-0001070081-26-000017"]
