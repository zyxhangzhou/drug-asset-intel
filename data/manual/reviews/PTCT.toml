[clinical]
design = "APHENITY（NCT05099640）：3 期、随机、双盲、安慰剂对照；第 1 部分 14 天开放标签应答评估，第 2 部分应答者 1:1 随机接受 6 周 sepiapterin（20/40/60 mg/kg 强制递增）或安慰剂；原文：\"phase 3, randomised, double-blind, placebo-controlled study\"、\"The primary endpoint for part 2, mean change from baseline in blood Phe after 6 weeks\"（MAN-PTCT-5）。AMPLIPHY：3 期、两部分、开放标签；第 2 部分随机交叉，sepiapterin 60 mg/kg/day 对 sapropterin 20 mg/kg/day 各 4 周；原文：\"randomized 1:1 to alternative treatment sequences of sepiapterin (60 mg/kg/day, licensed dosage) and sapropterin (20 mg/kg/day, maximum licensed dosage)\"（MAN-PTCT-6）。"
comparability = "AMPLIPHY 是与标准治疗 sapropterin（Kuvan 及仿制药）的随机交叉直接对比，同一人群、同一终点（血 Phe 较基线变化）。与 Palynziq（pegvaliase）没有直接对比，任何比较都是跨试验比较，人群与终点定义可能不同。"
result = "APHENITY：sepiapterin 组血 Phe 降低 63%，安慰剂组 +1%，原文：\"There was a significant reduction of blood Phe concentration after 6 weeks of sepiapterin (-63%, SD 20) compared with placebo (1%, 29\"（MAN-PTCT-5）；说明书表 7 治疗差异 \"Treatment difference (95% CI) in adjusted mean -64.2 (-74.1, -54.4)\"（FDA-LABEL-NDA219666）。AMPLIPHY：最小二乘均值差 -180.4 μmol/L，原文：\"least-squares mean difference of -180.4 μmol/L (95% CI: -229.5, -131.4; p < 0.0001)\"（MAN-PTCT-6）。安全性：\"Most treatment-emergent adverse events were mild gastrointestinal events\"（MAN-PTCT-5）。"
limitation = "两项试验都只把第 1 部分应答者（血 Phe 降低 ≥30%）纳入主要分析，结论限于 sepiapterin 应答人群，说明书适应症也限定为 \"sepiapterin-responsive phenylketonuria (PKU)\"（FDA-LABEL-NDA219666）；AMPLIPHY 为开放标签、每期 4 周；两项研究均由 PTC 资助（\"FUNDING: PTC Therapeutics.\"，MAN-PTCT-5）；长期认知与生活质量获益只见公司演示材料引用（\"Improved cognitive function and mood\"，MAN-PTCT-4），原文献未读。"
sources = ["MAN-PTCT-5", "MAN-PTCT-6", "MAN-PTCT-4", "FDA-LABEL-NDA219666", "CTG-NCT05099640"]

