[rights]
status = "partial"
note = "联合方案已部分对外授权：(1) Norgine 持欧洲、澳大利亚、新西兰独家商业权及部分开发权，原文：\"Norgine holds exclusive license for the commercial rights to the combination of tobevibart and elebsiran in Europe, Australia and New Zealand\"（MAN-VIR-1）；Vir 保留美国及其他市场，原文：\"while Vir Bio will retain commercial rights for the Licensed Product in the United States\"（SEC-0001628280-26-053549）；Norgine 分担 ECLIPSE 外部费用约 25%，原文：\"Norgine contributing approximately 25 % of external costs\"（SEC-0001628280-26-053549）。(2) Brii 已对两个成分行使大中华区选择权，原文：\"exercise of its option to obtain exclusive rights to develop and commercialize compounds and products arising from tobevibart in the Greater China Territory\"（MAN-VIR-1，elebsiran 于 2020 年 6 月行使）。引进与付费义务：elebsiran 自 Alnylam 引进，原文：\"we obtained a worldwide, exclusive license to develop, manufacture and commercialize siRNA product candidates directed to HBV, including elebsiran\"，Alnylam 未选择利润分成（\"Alnylam elected to not opt-in to the profit-sharing arrangement\"），Vir 仍需付 \"up to $145.0 million for remaining development and regulatory milestones for elebsiran\"、销售里程碑最高 2.5 亿美元及 \"low double-digits to mid-teens\" 提成，并分享转授权收入（MAN-VIR-1）。tobevibart 为自研（\"Tobevibart was identified using our proprietary antibody discovery platform\"），但使用 Xencor（非独占，HBV 项目里程碑最高 7,780 万美元，低至中个位数提成）、Rockefeller（低个位数提成）、IRB（低个位数提成）许可技术，后两者同样分享转授权收入（MAN-VIR-1）。判为 partial 而非 restricted：Norgine 的开发权与联合委员会限于其授权区域，美国权益在 Vir 手中；该判断待签核人确认。"
sources = ["MAN-VIR-1", "SEC-0001628280-26-053549"]
