[clinical]
design = "SOLSTICE（NCT05461170），2 期、开放标签、随机：联合组 tobevibart + elebsiran 每 4 周 vs tobevibart 单药每 2 周；原文：\"In this ongoing, phase 2, open-label trial, we randomly assigned participants\"；主要终点为第 24 周复合应答（HDV RNA 检测不到或下降 ≥2 log10，且 ALT 复常），原文：\"The primary end point was a combined response\"（MAN-VIR-3）。"
comparability = "试验内对照为 tobevibart 单药，不是标准治疗；与 bulevirtide 的比较只能跨试验，人群与终点定义可能不同。头对头对比 bulevirtide 的是 ECLIPSE 3，原文：\"ECLIPSE 3 (NCT07142811) is a Phase 2b head-to-head trial\"（MAN-VIR-2），尚未读出。"
result = "第 24 周复合应答联合组 47%（15/32）、单药组 70%（23/33），原文：\"a combined response was observed in 47% of participants (15 of 32)\"；第 48 周 HDV RNA 检测不到 66% vs 48%，HBsAg <10 IU/mL 91% vs 21%，原文：\"an HBsAg level below 10 IU per milliliter in 91% (29 of 32)\"（MAN-VIR-3）；第 96 周 ITT 联合组 HDV RNA 检测不到 88%，原文：\"88% (28/32) of participants treated with the combination\"（MAN-VIR-2）。"
limitation = "主要终点上联合组数值低于单药组（ALT 复常率较低：\"normalization of the ALT level in 47% (15 of 32) and 76% (25 of 33)\"，MAN-VIR-3）；开放标签、样本小（每组约 32 人）；HDV RNA、ALT 为替代终点；第 96 周数据来自公司新闻稿，未见同行评审全文。"
sources = ["MAN-VIR-3", "MAN-VIR-2"]

