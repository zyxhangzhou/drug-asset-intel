[clinical]
design = "2 期、单剂量、随机、安慰剂对照交叉研究，成人急性荨麻疹发作患者 21 例，分别接受 ARS-2 1 mg、2 mg 与安慰剂；原文：\"This was a phase 2, single-dose, randomized, placebo-controlled crossover efficacy study in which adult patients (n = 21) experiencing an acute flare or exacerbation of urticaria symptoms were treated with ARS-2 (1 or 2 mg) or placebo\"（MAN-SPRY-3）。CT.gov 登记：\"Each subject received all three treatments in a randomized sequence\"，主要终点 \"Effect of ARS-1 Versus Placebo Based on a Patient Reported Pruritus/Hive Score\"，时间点 120 分钟（CTG-NCT05496465）。10-Q 称其为 \"Phase 2 inpatient trial in 18 treatment-refractory CSU patients\"（SEC-0001193125-26-349140）。"
comparability = "仅安慰剂对照（交叉设计，受试者自身对照）。没有与抗组胺药或生物制剂的直接或间接比较；公司称 CSU 急性发作无获批按需疗法：\"There are currently no FDA-approved, on-demand products to manage acute flares in patients with CSU\"（MAN-SPRY-2），故无同终点可比的标准治疗关键试验。"
result = "主要终点达到：1 mg 与 2 mg 两剂量组患者报告风团与瘙痒评分均低于安慰剂（P < .05），研究者评估的荨麻疹范围与红斑评分亦更低；原文 \"Relative to placebo, both 1- and 2-mg doses of ARS-2 resulted in lower patient-reported hive and pruritus scores (P < .05)\"、\"Only minor adverse events were reported\"（MAN-SPRY-3）。CT.gov 发布结果（每组 18 例，均值±标准误，UAS 0–3）：风团 1 mg 1.1、2 mg 0.8、安慰剂 1.8；瘙痒 1 mg 0.4、2 mg 0.3、安慰剂 1.5（CTG-NCT05496465，\"UAS score 0 to 3\"）。"
limitation = "样本小（入组 21，结果分析 18）；单剂量、院内急性发作模型，与 2b 期门诊多次发作设计不同；CT.gov 登记 \"masking\": \"NONE\"，与论文「placebo-controlled」并存，患者自报终点在非盲下易偏倚；CT.gov 结果未登记统计分析，P 值只见于论文摘要；第一作者以外两位作者为公司员工（\"ARS Pharmaceuticals Operations, San Diego\"，MAN-SPRY-3）；2b 期剂量（\"ARS-2 (0.5 mg or 1 mg)\"，CTG-NCT06927999）与 2 期不同。"
sources = ["MAN-SPRY-3", "CTG-NCT05496465", "CTG-NCT06927999", "MAN-SPRY-2", "SEC-0001193125-26-349140"]

