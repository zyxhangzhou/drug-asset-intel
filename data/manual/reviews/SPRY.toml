note = "公司持有美国权益；美国以外已分区域授出（最新 10-Q，SEC-0001193125-26-349140）：(1) ALK-Abelló 持有除美国、日本、大中华区、澳新以外全球的鼻内肾上腺素产品独占许可，字段明确包含荨麻疹：\"exclusive license under certain of the Company’s patents and know-how to develop, manufacture and commercialize products containing epinephrine administered intranasally\"、\"for all human uses, including the immediate or emergency treatment of allergic reactions (including Type I) and anaphylaxis and urticaria\"；且新产品条款 \"upon ALK’s request such New Product will be included as a Product under the ALK Collaboration Agreement\"——ARS-2 若另立 NDA，ALK 可要求纳入（复核人可据此判为 restricted，见报告）。(2) 日本 Alfresa、(3) 中国大陆/香港/澳门/台湾 Pediatrix（\"for the exclusive license and sublicensable right to develop, import\"）、(4) 澳新 Seqirus（\"for the exclusive license to commercialize neffy in Australia and New Zealand\"）。ALK EEA 权益另有公司回购选择权：\"Prior to a change of control and outside of a set period of time after which the Company commences change of control negotiations, the Company may terminate the ALK Collaboration Agreement with respect to all countries in the European Economic Area\"（MAN-SPRY-1）。美国 neffy 与 ALK U.S. 有共同推广协议（服务商性质，\"The Company is the principal of all sales transactions of neffy in the U.S.\"，MAN-SPRY-1），\"Either party may terminate the ALK Co-Promotion Agreement in the event of an uncured material breach of the other party or for either party’s change of control\"。引进许可：Aegis 的 Intravail 技术 \"exclusive, worldwide, royalty-bearing, sublicensable\"，现向 OrbiMed 关联方支付 \"royalty payments to OrbiMed based on a mid-single-digit percentage of net product sales\"，剩余里程碑 \"totaled $9.0 million as of June 30, 2026\"。债务：RA Capital 牵头定期贷款 \"aggregate principal amount up to $250.0 million of term loans\"，已提取 Term A \"$ 100.0 million\"，\"secured by substantially all of the respective Credit Parties’ tangible and intangible assets and property, including intellectual property\"，违约事件含 \"the occurrence of a change in control\"。资金：10-Q 称 \"sufficient to meet its anticipated cash requirements for at least the 12 months following the date these financial statements are issued\"，8-K 称 \"anticipates a path to reaching cash flow breakeven by the end of 2027\"（MAN-SPRY-2）；快照 runway 8.2 个月按上半年烧钱计算，上半年含已削减的消费者广告。"
sources = ["SEC-0001193125-26-349140", "MAN-SPRY-1", "MAN-SPRY-2"]
