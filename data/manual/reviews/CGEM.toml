match_note = "CLN-978 是皮下给药的 CD19xCD3 T 细胞衔接器，定位于 B 细胞驱动的风湿病（SLE、RA、干燥综合征），公司把 1 期数据表述为「免疫重置」与「无治疗缓解」潜力，对应 BMS 画像中的「免疫重置」「持久缓解」「风湿病」；原文：\"CD19xCD3 T cell engager that we are developing for rheumatic diseases driven by pathogenic B cells\"（SEC-0001193125-26-336717）；\"achieved clinical remissions and deep B cell depletion, including indicators of immune reset\"、\"support the potential for CLN-978 to deliver durable, treatment-free remissions in the community out-patient setting\"（MAN-CGEM-2）。「免疫重置」「持久缓解」是公司基于 1 期的表述，不是已证实结论。组合冲突只按 10-K 竞争段核查：自免 CD19 TCE 竞品名单为 \"Amgen Inc., Roche Holdings AG, AstraZeneca plc, Merck & Co., Inc., Novartis AG, GSK plc., and Xencor, Inc.\"（SEC-0001193125-26-099362），不含 BMS；BMS 自身的 CD19 细胞疗法在 SLE 的布局未核查（未核查组合冲突）。"
thesis = [
  "Bristol Myers Squibb 需要「能带来持久缓解、组织修复或免疫重置的自身免疫药物，覆盖…风湿病」；Cullinan 的 CLN-978（CD19xCD3 T 细胞衔接器，皮下给药，系统性红斑狼疮，1 期）对应这一需求，因为公司报告单次目标剂量后难治 SLE 患者出现 DORIS 缓解与深度 B 细胞清除，并称有「免疫重置」迹象，且该资产为公司自研、全资持有。",
  "证据是 1 期 OUTRACE SLE 单臂剂量递增数据（≥4 周随访的 14 例中 10 例 hSLEDAI 下降≥4 分、5 例达 DORIS 缓解），无对照、无与 CAR-T 或其他 CD19 TCE 的直接比较，45 µg 剂量出现 1 例 3 级 CRS；下一事件是 SLE、RA 与干燥综合征的多剂量方案数据（2026 年 12 月，明确披露），SLE 与狼疮肾炎 2 期扩展计划 2027 年初启动；主要障碍是权益结构：CLN-978 本身权益完整、无债务、快照 EV 约 6.7 亿美元，但整体收购须同时承接 zipalertinib（Taiho 持有知识产权、美国利润五五分成）和 CLN-049（98% 控股子公司，少数股东有领售等权利）。",
]
thesis_sources = ["BMY-1", "BMY-2", "MAN-CGEM-1", "MAN-CGEM-2", "MAN-CGEM-3", "MAN-CGEM-4", "SEC-0001193125-26-336717", "SEC-0001193125-26-099362", "NASDAQ-CGEM-2026-10-28", "CTG-NCT06613360"]

