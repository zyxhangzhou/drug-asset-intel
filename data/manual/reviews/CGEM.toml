[rights]
status = "full"
note = "事实：10-Q：\"We hold worldwide intellectual property rights for CLN-978.\"（SEC-0001193125-26-336717）；10-K：\"We hold the worldwide intellectual property rights for CLN-978.\"（SEC-0001193125-26-099362）；公司新闻稿：\"CLN-978 was developed by an internal Cullinan team and is a wholly owned asset.\"（MAN-CGEM-1）。10-K 许可协议段只列 Genrix（velinotamig）、DKFZ/Tübingen（CLN-049）等，未见 CLN-978 的引进许可或对外授权，故无特许权使用费 / 里程碑义务（推断，中高）。CLN-978 组成物专利仍为申请：\"which, if issued, are expected to expire in 2040\"（SEC-0001193125-26-099362）。无借款：10-Q 资产负债表负债只有应付账款、应计费用与经营租赁负债（SEC-0001193125-26-336717）。整体收购时的公司层面负担：zipalertinib \"We are co-developing zipalertinib, for which Taiho holds intellectual property rights\"、\"each party will receive 50% of any future potential pre-tax profits from U.S. sales of zipalertinib\"；CLN-049 \"through a development subsidiary in which we had a 98% ownership interest\"（SEC-0001193125-26-336717）；10-K：\"rights such as drag-along rights in agreements with shareholders of the subsidiary\"（SEC-0001193125-26-099362）。"
sources = ["SEC-0001193125-26-336717", "SEC-0001193125-26-099362", "MAN-CGEM-1"]
