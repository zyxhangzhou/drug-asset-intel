[clinical]
design = "OUTRACE SLE：全球 1 期、单臂剂量递增，入组既往至少一种生物制剂或免疫抑制剂治疗、血清阳性的活动性 SLE（hSLEDAI≥6），入组前停用背景免疫抑制治疗；EULAR 2026 报告截至 2026-05-15 的 SLE 18 例（单次目标剂量 10–45 µg）；原文：\"OUTRACE SLE enrolls patients with active systemic lupus erythematosus (hSLEDAI ≥6)\"、\"all of whom discontinued background immunosuppressive therapies prior to study entry\"（MAN-CGEM-2）；\"This presentation is based on data from 29 patients evaluated as of May 15, 2026\"（MAN-CGEM-1）。"
comparability = "无对照组，无与标准治疗、CD19 CAR-T 或其他 CD19 T 细胞衔接器的直接比较；任何与它们的比较都是跨试验比较，人群与终点定义可能不同。公司「most comprehensive clinical data set to date for a CD19 T cell engager」为公司表述（MAN-CGEM-4）。"
result = "≥4 周随访的 14 例中 10 例（71%）hSLEDAI 下降≥4 分，5 例达 DORIS 缓解；单次目标剂量后 17 例中 14 例（82%）外周 B 细胞较基线下降>80%；原文：\"Among 14 patients with ≥4 weeks follow up\"、\"with 5 achieving a DORIS remission\"、\"peripheral B cell counts were reduced by >80% from baseline in 14 of 17 patients (82%)\"（MAN-CGEM-1）。"
limitation = "样本小、随访短（≥4 周）、单次目标剂量为主，多剂量方案 SLE 数据尚未公布；只有公司新闻稿与会议海报，无同行评议全文。安全性：\"A single case of Grade 3 CRS was observed following administration of the 45 μg target dose; enrollment to this cohort was discontinued\"（MAN-CGEM-1）。B 细胞为「dose-dependent recovery」，缓解持久性未知（MAN-CGEM-1）。"
sources = ["MAN-CGEM-1", "MAN-CGEM-2", "MAN-CGEM-4", "CTG-NCT06613360"]

