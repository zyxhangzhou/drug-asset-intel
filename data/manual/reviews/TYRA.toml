note = "事实：10-K：\"all of which are solely owned by us. We do not license any material patent rights from any third party.\"、\"We currently solely own intellectual property covering our product candidates.\"（MAN-TYRA-1）；10-Q：\"we have built a wholly-owned pipeline of oral small molecule product candidates\"（SEC-0001193125-26-332995）。10-K 全文检索未见对外授权、优先谈判权、共同开发或共同商业化条款，10-Q 未见合作附注，因此无应付许可方的特许权使用费 / 里程碑（推断，中高）。专利：\"expected to expire on dates ranging from 2040 to 2046\"（MAN-TYRA-1）。无借款：10-Q 资产负债表负债只有应付账款、租赁负债与应计费用（总负债 29,698 千美元）。资金：10-Q：\"will be sufficient to fund our operating expenses and capital expenditures into the second half of 2028\"（SEC-0001193125-26-332995），该指引早于 2026 年 9 月约 4 亿美元增发（\"gross proceeds to Tyra from the offering\"，MAN-TYRA-4）。"
sources = ["MAN-TYRA-1", "SEC-0001193125-26-332995", "MAN-TYRA-4"]
