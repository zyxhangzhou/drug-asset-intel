[clinical]
design = "SURF302：2 期、多中心、开放标签、单臂（两个剂量组随机分配），FGFR3 突变 LG IR NMIBC，口服 dabogratinib 50 mg 或 60 mg QD；主要终点 3 个月 CR 率；原文：\"Up to 30 participants are being randomized initially to treatment with oral dabogratinib at 50 mg QD or treatment with oral dabogratinib at 60 mg QD\"、\"The primary endpoint is CR rate at three months\"（MAN-TYRA-1）。中期数据截至 2026-08-31：安全性 44 例，疗效可评估 26 例（60 mg 14 例、50 mg 12 例）；原文：\"26 participants were evaluable for efficacy across the 60 mg QD (n=14) and 50 mg QD (n=12) cohorts\"（MAN-TYRA-2）。"
comparability = "无对照组，剂量组之间不是与标准治疗的比较。与 J&J TAR-210（\"demonstrated a 90% CR rate in IR patients\"，MAN-TYRA-1）或其他膀胱内治疗的任何比较都是跨试验比较，人群与终点定义可能不同；SURF302 入组人群约 61% 未接受过膀胱内治疗（\"Approximately 61% of the enrolled patients had no prior lines of intravesical treatment\"，MAN-TYRA-2）。"
result = "60 mg QD：3 个月 ORR 79%（11/14）、CR 57%（8/14），最佳总缓解 CR 64%（9/14）；50 mg QD：ORR 67%（8/12）、CR 33%（4/12）；原文：\"79% (11/14)\"、\"57% (8/14)\"、\"33% (4/12)\"（MAN-TYRA-2）。安全性：\"Grade 3 treatment-related AEs occurred in 2 of 44 participants (4.5%) across both cohorts, both at 50 mg QD, with none at 60 mg QD\"、\"At 60 mg QD, there were no dose reductions or treatment-related discontinuations\"（MAN-TYRA-2）。"
limitation = "样本小（60 mg 疗效可评估 14 例），随访短：只有 5 例 3 个月 CR 有 6 个月评估（\"All 3-month CRs with 6-month assessments remained in response at 6 months (n=5)\"，MAN-TYRA-2）；中期数据可能变化；只有公司 8-K，无同行评议全文或会议摘要。注册路径为辅助治疗设定，与本试验的消融设定不同，剂量与 3 期设计待 FDA 反馈（\"subject to that feedback\"，MAN-TYRA-2）。"
sources = ["MAN-TYRA-1", "MAN-TYRA-2", "CTG-NCT06995677"]

