match_note = "ERAS-0015 是 pan-RAS 分子胶，在 1 期中以 2L+ KRAS G12X 非小细胞肺癌（NSCLC）为主要数据适应症之一，公司计划在 2L+ NSCLC 和 RAS 突变 NSCLC 启动潜在注册试验，对应 AZ 画像中的「肺癌」「靶向小分子」；原文：\"ERAS-0015 is a potential best-in-class, next-generation pan-RAS molecular glue in clinical development for the treatment of patients with RAS-mutated solid tumors\"、\"Potentially registration-enabling trial in 2L+ NSCLC expected to initiate in the first half of 2027\"（SEC-0001193125-26-344611）。把分子胶归为「靶向小分子」是推断（中高）：10-K 称其为 \"pan-RAS molecular glue\"，并提及 \"improved potency and oral bioavailability\"（MAN-ERAS-2），未直接写 small molecule。组合冲突只按 10-K 竞争段核查：RAS/MAPK 通路在研公司名单为 \"Adlai Nortye, Amgen, Boehringer Ingelheim, BridgeBio Oncology Therapeutics, Bristol Myers Squibb, Eli Lilly, GenFleet Therapeutics, Jacobio Pharmaceuticals, Merck, Pfizer, Revolution Medicines, and Roche/Genentech\"（MAN-ERAS-2），不含 AstraZeneca；AZ 自身 RAS 管线未用一手来源核查（未核查组合冲突）。"
thesis = [
  "AstraZeneca 需要「肺癌、乳腺癌、血液瘤的…靶向小分子」；Erasca 的 ERAS-0015（pan-RAS 分子胶，RAS 突变实体瘤，重点为 2L+ KRAS G12X 非小细胞肺癌与胰腺癌，1 期）对应这一需求，因为公司报告 2L+ KRAS G12X NSCLC 在药理活性剂量下 62% uORR（N=37），并计划 2027 年上半年在 2L+ NSCLC 启动潜在注册试验，且 ERAS-0015 已通过行使 Joyo 期权取得全球独占许可。",
  "证据是 1 期剂量递增的初步数据（美国 AURORAS-1 与 Joyo 中国 JYP0015M101 合并，含未确认缓解，与 RMC-6236 只有跨试验比较，另有 1 例 5 级肺炎死亡）；下一事件是 2L+ NSCLC 潜在注册试验启动（2027 年上半年，明确披露）；主要障碍是知识产权纠纷：Revolution Medicines 来函指控 ERAS-0015 等同侵犯其美国专利并涉及商业秘密，同时快照 EV 约 49 亿美元（按 6 月 30 日现金，未计 7 月 5.935 亿美元增发净额），收购还须承接 Joyo 里程碑与特许权使用费。",
]
