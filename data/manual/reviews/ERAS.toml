[rights]
status = "full"
note = "事实：ERAS-0015 从 Guangzhou Joyo Pharmatech 引进。原许可为 \"exclusive, worldwide (except mainland China, Hong Kong, and Macau), royalty-bearing license\"；2026 年 3 月公司 \"was exercising its option to expand its territory under the Joyo License Agreement to include mainland China, Hong Kong, and Macau\"，并支付 \"$ 150.0 million\"，因此现为全球独占许可；可分许可：\"The Company has the right to sublicense (through multiple tiers)\"（SEC-0001193125-26-344611）。对许可方的义务：\"development and regulatory milestone payments of up to $ 57.5 million and commercial milestone payments of up to $ 125.0 million\"，\"tiered royalties on net sales of all licensed products, in the low- to mid-single digit percentages\"（SEC-0001193125-26-344611）。终止时 \"Joyo has an option to negotiate a license\"（MAN-ERAS-2）。10-K / 10-Q 未见 ERAS-0015 的对外授权、选择权或共同开发；与 Tango、Merck 的协议只是临床试验合作与供药（\"we are providing ERAS-0015 to Tango at no cost\"、\"Merck is providing its anti-PD-1 therapy, KEYTRUDA ® (pembrolizumab), at no cost\"）。Joyo 主办的中国试验数据归属未披露（待核实）。知识产权风险：2026-04-24 \"we received a letter from legal counsel for Revolution Medicines, Inc. (RevMed)\"，指控 ERAS-0015 \"under the doctrine of equivalents\" 侵权，并称 \"a third party misappropriated RevMed\" 的商业秘密（SEC-0001193125-26-344611）。另有证券集体诉讼与股东派生诉讼（\"a purported securities class action complaint was filed against us\"）。无借款：10-Q 资产负债表负债只有应付账款、应计费用、经营租赁负债与其他负债（SEC-0001193125-26-344611）。"
sources = ["SEC-0001193125-26-344611", "MAN-ERAS-2"]
