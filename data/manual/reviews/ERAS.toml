[clinical]
design = "美国 AURORAS-1（NCT06983743，1 期剂量递增 + 扩展）与 Joyo 在中国的 JYP0015M101 1 期合并分析，入组 RAS 突变实体瘤（CRC、NSCLC、PDAC），单臂、无对照；原文：\"include patients with RAS-mutant solid tumors, including colorectal cancer (CRC), non-small-cell lung cancer (NSCLC), and pancreatic adenocarcinoma (PDAC)\"、\"AURORAS-1 data cutoff (DCO) 4Apr2026; JYP0015M101 DCO 27Feb2026\"；RDE 选定 \"24 mg and 32 mg QD were selected as the go-forward monotherapy RDEs\"（SEC-0001193125-26-344611）。"
comparability = "无对照组，无与标准治疗的直接比较。公司把结果与 RevMed 的 RMC-6236 已发表数据对比（\"Comparator as used in this report, RMC-6236\"，SEC-0001193125-26-344611），属跨试验比较，人群与终点定义可能不同；RevMed 已来函指控公司不当比较（\"improperly compared preclinical data of ERAS-0015 and RMC-6236\"）。"
result = "2L+ KRAS G12X NSCLC：药理活性剂量 16–32 mg QD 下 \"62% uORR 8wk (N=37)\"，RDE 24–32 mg QD 下 \"64% uORR 8wk (N=25) in 2L+ KRAS G12X NSCLC\"；2L KRAS G12X PDAC：\"40% uORR 14wk (N=20) in 2L KRAS G12X PDAC\"；7 月更新（美国试验，DCO 2026-05-25）：\"57% uORR 8wk (N=7) at RDE of 32 mg QD\"（2L+ PDAC）；药效学：\"100% of patients (14/14) showing at least 75% reduction in KRAS G12X variant allele fraction\"（SEC-0001193125-26-344611）。"
limitation = "缓解率含未确认缓解：\"The uORR 8wk is the ORR (confirmed and unconfirmed responses)\"；样本小（RDE 下 PDAC 只有 N=2 或 N=7），随访短，无 PFS / OS 数据；中国数据来自 Joyo 主办的试验。安全性：\"One Grade 3 TRAE of pneumonitis progressed to Grade 5 after withdrawal of supportive care per patient decision\"（SEC-0001193125-26-344611）。只有公司披露，无同行评议全文。"
sources = ["SEC-0001193125-26-344611", "MAN-ERAS-1", "CTG-NCT06983743"]

