match_note = "soquelitinib 是口服、选择性、共价 ITK 抑制剂，通过阻断 Th2/Th17 并增加 Treg 来调节免疫，对应 Novartis 画像中的「皮炎」「哮喘」「免疫调节剂」「生物标志物」；原文：\"an investigational selective, orally bioavailable, covalent inhibitor of ITK\"、\"Soquelitinib is also being evaluated in a randomized, placebo-controlled Phase 2 trial in patients with atopic dermatitis\"、\"a Phase 2 clinical trial in asthma\"、\"Reduction in serum IL-4 cytokine was observed in cohorts 3 and 4\"、\"potential for drug-free remissions\"（SEC-0001104659-26-091975）。不符项：画像强调「长效」，soquelitinib 为每日一次或两次口服，长效只有停药后随访的初步信号（\"The disease control continued in the 30-day post treatment follow up period\"，同上）。生物标志物目前用于机制验证，未用于患者分层。组合冲突只按 10-K 竞争段核查：AD 竞品公司名单为 \"Abbvie, Pfizer, Sanofi, Amgen, GSK and Lilly\"，不含 Novartis（MAN-CRVS-1）；未核查 Novartis 自身早期管线中是否有 ITK 或同类口服 T 细胞调节剂。"
thesis = [
  "Novartis 需要「过敏、哮喘、皮炎和自身免疫的抗体或免疫调节剂，强调长效及生物标志物分层」；Corvus 的 soquelitinib（口服选择性共价 ITK 抑制剂，特应性皮炎，2 期）对应这一需求，因为它通过阻断 Th2/Th17、增加 Treg 来调节免疫，已在 AD 开展随机安慰剂对照 2 期，并计划启动哮喘 2 期，1 期中观察到 IL-4、IL-5 等血清标志物下降。",
  "证据是随机、盲法、安慰剂对照 1 期第 4 队列（n=12 对 10）第 56 天 EASI 平均降幅 72% 对 40%（p=0.035），EASI-75 为 75% 对 20%，样本小，且无与 dupilumab 等标准治疗的直接对比；下一事件是同一资产在复发/难治外周 T 细胞淋巴瘤（PTCL）3 期主要终点数据（2027-11，CT.gov 估算；AD 2 期 CT.gov 估算主要完成 2027-06）；主要障碍是权益：大中华区权益已授权给 Corvus 持股约 49% 的 Angel Pharmaceuticals，全资收购需同时处理该区域（快照 EV 约 6.7 亿美元，<20 亿档）。",
]
