[clinical]
design = "随机、双盲、安慰剂对照 1 期，既往至少一种外用或系统治疗失败的中重度 AD；4 个剂量队列（100 mg BID、200 mg QD、200 mg BID、400 mg QD），队列 1–3 按 3:1 随机、治疗 28 天；队列 4 扩为 24 例 1:1 随机 200 mg BID 或安慰剂、治疗 56 天；原文：\"randomized, double-blind, placebo-controlled Phase 1 clinical trial with soquelitinib in patients with moderate to severe atopic dermatitis\"、\"Cohort 4 was expanded to enroll 24 patients randomized 1:1 to receive soquelitinib 200 mg BID (the same dose as cohort 3) or placebo\"（SEC-0001104659-26-091975）。"
comparability = "只有安慰剂对照，与 dupilumab、JAK 抑制剂、IL-13 抗体等无直接对比；任何与已上市药的比较都是跨试验比较，人群与终点定义可能不同。队列 4 每组样本量小（12 对 10，2 例安慰剂缺第 56 天访视）。"
result = "队列 4 第 56 天 EASI 平均降幅 72% 对 40%，p=0.035；EASI-75 / EASI-90 / IGA 0-1 分别为 75%/25%/33% 对 20%/0%/0%；原文：\"the mean percent reduction in EASI for patients receiving soquelitinib in cohort 4 (n=12) was 72%, compared to 40% for patients receiving placebo (n=10)\"、\"achieved in 75%, 25% and 33% of patients receiving soquelitinib, respectively, compared to 20%, 0% and 0%, respectively, for the placebo group\"（SEC-0001104659-26-091975）。队列 3（200 mg BID，28 天）EASI 降幅 71.1% 对 42.1%：\"71.1% for patients receiving soquelitinib and 42.1% for patients receiving placebo\"（同上）。安全性：\"all were Grade 1-2\"（同上）。"
limitation = "1 期、小样本，只有队列 4 一项 p 值；EASI-75 等为描述性比例，未见统计检验。数据为公司在 10-Q 与 SID 会议上的表述，本次未打开 SID 摘要或同行评议全文。生物标志物与「drug-free remissions」为探索性结果：\"potential for drug-free remissions\"（SEC-0001104659-26-091975）。2 期 SIERRA1（约 200 例，12 周，主要终点 EASI 较基线变化百分比）尚未读出：\"The primary endpoint of the trial is the percent change from baseline in EASI score at week 12\"（同上）。"
sources = ["SEC-0001104659-26-091975", "MAN-CRVS-2", "CTG-NCT06345404"]

