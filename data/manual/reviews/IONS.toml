thesis = [
  "Novartis 需要「神经退行性疾病遗传药物」，并偏好「xRNA/siRNA及递送」平台配套临床资产；Ionis 的 obudanersen（ION582，抑制 UBE3A 反义转录本的鞘内反义寡核苷酸，Angelman 综合征，3 期）对应这一需求，因为它是针对单基因遗传神经疾病的 RNA 靶向药，已获 FDA 突破性疗法认定，且是 Ionis 全资持有的晚期资产；但 Angelman 属神经发育而非神经退行性疾病，匹配属领域 + 技术类型层面。",
  "证据是开放标签 1/2 期 HALOS 在沟通、认知、运动各功能领域显示改善且各剂量安全性良好（无对照，无与标准治疗的比较）；下一事件是安慰剂对照 3 期 REVEAL 数据读出（2027 年下半年，明确披露）；主要障碍是成本与形式：Ionis 是拥有 7 个上市产品的商业化公司，快照 EV 约 61 亿美元（50–150 亿档）并有 13.45 亿美元可转债，整体收购代价高，更现实的是 obudanersen 单资产全球或区域许可。",
]
