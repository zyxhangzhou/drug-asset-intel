design = "1/2 期 HALOS（NCT05127226）：开放标签、多剂量递增、鞘内给药；原文：\"the open label Phase 1/2 study, HALOS, of obudanersen in patients with AS designed to assess the safety, tolerability and activity of multiple ascending doses of obudanersen administered intrathecally\"（SEC-0000874015-26-000251）。注册研究为安慰剂对照 3 期 REVEAL（NCT06914609）：\"the ongoing placebo-controlled Phase 3 REVEAL study of obudanersen designed to assess the efficacy, safety and tolerability of obudanersen administered intrathecally in children and adults with AS who have a maternal UBE3A gene deletion or mutation\"（MAN-IONS-1）。"
comparability = "HALOS 无对照组，无法与安慰剂或标准治疗比较；AS 目前没有获批的疾病修饰疗法（\"there are no approved disease modifying therapies\"，MAN-IONS-1），同机制竞品 apazunersen（Ultragenyx）、rugonersen（Oak Hill Bio / Roche）均在 3 期，任何比较都是跨试验比较，人群与终点定义可能不同。"
