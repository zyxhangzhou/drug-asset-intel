note = "推断（中高）：10-K 原文：\"We currently have three wholly owned medicines in late-stage development, including obudanersen (formerly ION582) for Angelman syndrome\"；Biogen 原有选择权已失效：\"In 2024, Biogen’s option to license obudanersen, an investigational antisense medicine for the potential treatment of Angelman syndrome, or AS, expired unexercised.\"（MAN-IONS-1）。最新 10-Q（2026-06-30）：\"We currently have two wholly owned medicines and eight partnered medicines in Phase 3 development, including obudanersen\"，并把 obudanersen 列在 \"Our Innovative Late-Stage Pipeline of Ionis-Owned Investigational Medicines\" 下（SEC-0000874015-26-000251）。10-Q 合作附注（Biogen、GSK、Ono、Otsuka、Recordati、Roche）未出现 obudanersen 的新许可；2026-07 至 2026-10 的 8-K 新闻稿也未见。未发现 obudanersen 的引进许可或对许可方的特许权使用费义务；Biogen 选择权失效后是否残留付款义务，文件未写明。债务：\"we completed a $ 770.0 million offering of our 0 % Notes due 2030\"（2030-12 到期）、\"we completed a $ 575.0 million offering of our 1.75 % Notes due 2028\"（2028-06 到期），两笔于 2026-06-30 仍全额未偿（SEC-0000874015-26-000251）；另有 Royalty Pharma 特许权出售负债 562,574 千美元（10-Q 资产负债表 \"Liability related to sale of future royalties, net\"），对应 \"we sold a minority interest in our future SPINRAZA and pelacarsen royalties to Royalty Pharma\"（MAN-IONS-1），与 obudanersen 无关。资金：\"will be sufficient to fund our planned operations and these obligations\"（SEC-0000874015-26-000251）。"
sources = ["MAN-IONS-1", "SEC-0000874015-26-000251", "MAN-IONS-2"]
