[rights]
status = "full"
note = "10-K/10-Q 没有「RGX-202 为全资资产」的原句；判断依据是合作披露的穷尽（推断，置信度中）：10-Q 只把 sura-vec 列给 AbbVie、RGX-121/RGX-111 列给 Nippon Shinyaku，原文 \"Sura-vec is being developed and commercialized in collaboration with AbbVie\"、\"RGX-121 and RGX-111 are being developed and commercialized in collaboration with Nippon Shinyaku\"，RGX-202 不在其中，且由公司自建产能生产商业供货（\"We have completed manufacturing the first batches of RGX-202 intended for commercial supply\"）（SEC-0001193125-26-336725）。上游许可义务：NAV 平台来自 Penn 与 GSK 独家许可，须付 Penn \"low- to mid-single digit royalties on net sales of licensed pharmaceutical products sold by us or our affiliates\" 及 \"up to $20.5 million upon the achievement of various development and sales-based milestones\"；GSK 许可的销售分成转付 Penn；GSK 保留 \"AAV9 for the treatment of Muscular Dystrophy\" 的权利（RGX-202 用 AAV8，判断不冲突）；与 GSK 存在分许可费争议（\"We have been notified of a dispute with GSK over the amount of sublicense fees\"）（MAN-RGNX-1）。债务（数据包 total_debt 为空）：\"Royalty monetization liabilities are accounted for as debt\"，2026-06-30 合计 181,511 千美元（2020 HCR 协议 11,807、2025 Royalty Bond 169,704）；Royalty Bond 以 Novartis、Nippon Shinyaku、Rocket、Ultragenyx 许可的特许权收入为担保（\"The 2025 Royalty Bond is collateralized by a security interest and lien on the Royalty Interest.\"），不涉及 RGX-202，且 \"may not be prepaid prior to maturity\"（SEC-0001193125-26-336725）。10-Q/10-K 未见控制权变更条款。"
sources = ["SEC-0001193125-26-336725", "MAN-RGNX-1"]
