match_note = "RGX-202 是一次性静脉给药的 AAV8 基因疗法，递送含 C 端结构域的新型 microdystrophin，治疗遗传病杜氏肌营养不良（DMD），对应「基因疗法……遗传性疾病药物」；原文：\"using the NAV AAV8 vector to deliver a transgene for a novel microdystrophin\"（SEC-0001193125-26-336725）、\"one of the most common fatal genetic disorders affecting children\"（MAN-RGNX-1）。另与 AZ 技术偏好 #2「递送和制造优势明显、可重复生产的临床平台」相符：公司自建悬浮工艺产线，原文 \"in-house, state-of-the-art manufacturing that has demonstrated leading purity levels in Duchenne (>80% full capsids)\"（SEC-0001193125-26-336725）。10-K 的 DMD 竞争段落点名 Sarepta/Roche（Elevidys）与 Novartis，不含 AstraZeneca（MAN-RGNX-1），但该名单不是完整核查（未核查组合冲突）。"
thesis = [
  "AstraZeneca 需要「基因疗法、体内细胞疗法、补体/酶替代和遗传性疾病药物」；REGENXBIO 的 RGX-202（AAV8 递送含 C 端结构域的 microdystrophin 的一次性基因疗法，杜氏肌营养不良，关键性 3 期已达主要终点、公司计划 2026 年三季度启动加速批准 BLA 提交）对应这一需求，因为它是针对致死性遗传病的基因疗法，且是公司未对外授权、自主开发并自建商业化产能的主导项目。",
  "证据是开放标签单臂关键性试验的替代终点：30 例中 93% 患者第 12 周 microdystrophin 表达超过 10%（p<0.0001），12 个月功能数据仅 9 例且只与预期病程（外部对照）比较，FDA 仍建议随机对照试验，与 Elevidys 无直接比较；下一事件是 DMD 适应症 BLA 的 FDA 加速批准决定（2027H2，公司明确披露，以 BLA 按计划提交为前提）；主要障碍是资金：6 月末现金 1.055 亿美元，靠 7 月 AbbVie 里程碑与增发才把现金跑道延至 2027 年四季度，另有按债务核算的 HCR 特许权货币化负债 1.815 亿美元。"
]
