[clinical]
design = "多中心、开放标签 1/2/3 期 AFFINITY DUCHENNE（NCT05693142），一次性静脉给药，关键性部分剂量 2x10^14 GC/kg、约 30 例 1–11 岁可行走患者，主要终点为第 12 周 microdystrophin 表达 ≥10% 的比例。原文：\"AFFINITY DUCHENNE ® is an ongoing multicenter, open-label Phase I/II/III trial\"（SEC-0001193125-26-336725）、\"the primary endpoint of the pivotal trial is the proportion of participants whose RGX-202 microdystrophin expression is ≥ 10% at Week 12\"（MAN-RGNX-1）"
comparability = "单臂、无同期对照；功能数据与「预期病程」（外部自然史估计）比较，与已上市的 Sarepta/Roche Elevidys 无直接比较，任何比较都是跨试验比较，人群与终点定义可能不同。主要终点为 microdystrophin 表达（替代终点）。原文：\"using multiple validated methods to estimate expected disease progression without treatment\"（SEC-0001193125-26-336725）"
result = "2026 年 5 月关键性 3 期 topline：主要终点达到，93% 患者 microdystrophin 表达超过 10%（p<0.0001，n=30）；耐受性良好；12 个月 NSAA 与定时功能测试显示改善（n=9），表达量与功能改善显著相关。原文：\"93% of patients achieved RGX-202 microdystrophin expression above 10% (p<0.0001)\"、\"Statistically significant correlation between RGX-202 microdystrophin expression level and functional improvement, supporting validity of surrogate endpoint.\"（SEC-0001193125-26-336725）"
limitation = "替代终点、单臂、功能数据样本小（\"interim functional data (n=9 at 12 months)\"）；FDA 仍建议随机对照试验（\"While the FDA has recommended a randomized controlled trial\"），公司计划 2027 上半年启动海外随机安慰剂对照研究 AFFINITY RISE（\"a new, ex-U.S. randomized, placebo-controlled study to support RGX-202 global regulatory submissions\"）（SEC-0001193125-26-336725）。安全性为中期数据；未打开 topline 新闻稿与会议摘要原文，具体功能评分差值未取得。"
sources = ["SEC-0001193125-26-336725", "MAN-RGNX-1", "CTG-NCT05693142"]

