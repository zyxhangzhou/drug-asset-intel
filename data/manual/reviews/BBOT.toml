note = '''10-K / 10-Q 未披露任何第三方持有 BBO-8520 的许可、选择权、优先谈判权或共同开发 / 共同商业化权利；全球权益在公司手中为根据上述披露的推断。BBO-8520 相关权利为独家引进：LLNS 原文 "received a worldwide, exclusive, royalty-bearing, sublicensable (through no more than two tiers) license under certain patent rights relating to the KRAS G12C inhibitor compounds"；Leidos（Frederick National Laboratory）原文 "received a worldwide, exclusive, royalty-bearing, sublicensable (through multiple tiers) license under patent rights relating to the KRAS G12C inhibitor compounds"（MAN-BBOT-1）。专利申请与两家共有："Our patent portfolio consists of patent applications co-owned with Lawrence Livermore National Security, LLC and Frederick National Laboratory for Cancer Research"；美国政府保留非独家许可："the United States government reserves the right to a nonexclusive, royalty-free, irrevocable, nontransferable license under the licensed patent rights"（MAN-BBOT-1）。对许可方义务（KRAS G12C 协议）：LLNS "a low single-digit tiered royalty on sales of licensed products"、"up to a total of $7.0 million in regulatory and commercialization milestones based upon indication"、转授权非特许权收入 "a mid double-digit percentage in the range of 45% to 55%"、"an assignment fee of a specified amount"；Leidos PLA II "a low, single-digit royalty on sales of licensed products"、"$6.75 million in development milestones for the first indication for the first licensed product"、转授权收入 "a low double-digit percentage in the range of 5% to 15%"（MAN-BBOT-1）。10-Q 汇总口径（覆盖全部项目）：LLNS "half of the Company's sublicensing income, capped at $ 2.0 million per year for each indication"、里程碑 "totaling up to $ 21.8 million"；Leidos "$ 25.9 million upon the achievement of certain clinical and regulatory milestones"（SEC-0001193125-26-344661）。控制权变更相关争议：UCSF 主张 "the Indexed Milestone Payment in an amount less than $5.0 million will become due"，公司不认可（SEC-0001193125-26-344661）。待核实：2025-07 与关联方的研究合作协议 "to grant a license over its intellectual property with respect to the new indication being developed by the RCA Party"（SEC-0001193125-26-344661），未写明涉及哪个化合物及适应症。已读文件中未见与 Merck 的 pembrolizumab 供药或合作协议。债务：10-Q 未见票据或贷款；现金指引原文 "sufficient to enable us to fund our operating expenses and capital expenditure requirements into 2028"（SEC-0001193125-26-344661）。'''
