design = '''1 期、开放标签、多中心 ONKORAS-101（NCT06343402），评估 BBO-8520 单药及联合 pembrolizumab 用于 KRAS G12C 突变 NSCLC。原文："ONKORAS-101 is an open-label, multi-center Phase 1a/1b study designed to evaluate the safety, tolerability, preliminary antitumor activity, and pharmacokinetics of BBO-8520 as a single agent and in combination with pembrolizumab"（SEC-0001193125-26-344661）。数据截止 "data cutoff: June 1, 2026"（MAN-BBOT-2）；疗效分析集为随访至少 12 周的患者："analysis set includes patients with at least 12 weeks of follow-up"，联合队列全部 PD-L1 TPS≥1%（MAN-BBOT-3）。'''
