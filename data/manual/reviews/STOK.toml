[rights]
status = "restricted"
note = "事实（10-Q 合作附注）：美国、加拿大、墨西哥以外权益已独家许可给 Biogen，双方共同开发并分摊费用，Biogen 另持有后续 SCN1A ASO 的许可选择权。原文：\"the Company granted Biogen an exclusive, royalty bearing license to develop, manufacture and commercialize licensed products outside the United States, Canada and Mexico\"、\"Biogen also has an option to exercise an exclusive, royalty-bearing, sublicensable and transferable license to certain future follow on antisense oligonucleotides\"、\"The parties are jointly developing zorevunersen, with the Company leading global development, and development costs are shared pursuant to an agreed budget, with the Company responsible for 70 % and Biogen responsible for 30 %.\"（SEC-0001193125-26-330557；10-K 同款，MAN-STOK-1）。按简报规则（共同开发 / 他方持有选择权即为受限）记 restricted；但选择权只涉及后续化合物，共同开发只是费用分摊、北美商业化权益仍在 Stoke，形态接近 BHVN / IDYA 的「区域许可 + 费用分摊」（判为 partial），复核人可改判为 partial（区域：美国、加拿大、墨西哥以外归 Biogen）。推荐交易形式为北美区域许可，与两种判法都兼容。引进许可：TANGO 平台及 zorevunersen 专利来自南安普顿大学，原文：\"we in-license key patents and patent applications for our proprietary protein upregulation platform, zorevunersen, STK-002\"（SEC-0001193125-26-330557），须付里程碑与销售特许权使用费，转授权收入需付 \"a mid-single digit percentage of the sublicense revenue to the University of Southampton\"，Biogen 交易已计提 \"a liability of $8.2 million for a sublicense fee expense\"（MAN-STOK-1）。债务：最新 10-Q 负债仅应付账款、应计负债、递延收入及其他长期负债，无票据或贷款。资金：\"This cash position is expected to fund operations into early 2028.\"（MAN-STOK-2，现金 $358.8M，截至 2026-09-30）。"
sources = ["SEC-0001193125-26-330557", "MAN-STOK-1", "MAN-STOK-2"]
