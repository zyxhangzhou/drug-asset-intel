[clinical]
design = "已完成：MONARCH（美国）与 ADMIRAL（英国）两项 1/2a 期开放标签多中心研究，单次及多次递增剂量鞘内给药，入组 81 例 2–18 岁患者，之后进入 SWALLOWTAIL / LONGWING 延伸研究；原文：\"two phase 1-2a, open-label, multicenter studies (MONARCH and ADMIRAL)\"、\"A total of 81 patients were enrolled in the phase 1-2a studies\"（MAN-STOK-3）。进行中：3 期 EMPEROR，原文：\"The pivotal Phase 3 study is a global, randomized, double-blind, sham controlled trial\"，主要终点 \"percent change from baseline in major motor seizure frequency in patients receiving zorevunersen as compared with sham\"（MAN-STOK-1）。"
comparability = "1/2a 期无对照组，叠加在标准抗癫痫药之上（\"receiving standard antiseizure medications\"，MAN-STOK-3）。公司另做了与 BUTTERFLY 自然史队列的倾向评分加权比较：\"a propensity score weighted analysis comparing the effects of zorevunersen to the BUTTERFLY natural history study\"（MAN-STOK-1），属跨试验比较，人群与终点定义可能不同。与 Epidiolex、Fintepla 等已批准药物无直接对比。"
result = "接受 70 mg（1–3 剂）后进入延伸期（≤45 mg）的患者，延伸期前 20 个月惊厥发作频率中位变化 -58.82% 至 -90.91%；原文：\"had a median change from baseline in convulsive-seizure frequency ranging from -58.82% to -90.91% across 1-month intervals during the first 20 months of the extension studies\"（MAN-STOK-3）。认知行为：\"The data supported improvements in overall clinical status, quality of life, and adaptive behavior\"（MAN-STOK-3）。"
limitation = "开放标签、无对照、样本小；疗效为次要/探索性分析。安全性：\"2 died from sudden unexpected death in epilepsy\"、延伸期 \"an elevated protein level in cerebrospinal fluid (in 45%)\"、\"One patient had suspected unexpected serious adverse reactions\"（MAN-STOK-3）。3 期认知行为关键次要终点的分析方法刚与 FDA 对齐改为四个 Vineland-3 子域的多组分评估（\"a multicomponent assessment of four Vineland-3 subdomains\"，MAN-STOK-2），尚无随机对照数据验证。"
sources = ["MAN-STOK-1", "MAN-STOK-2", "MAN-STOK-3", "CTG-NCT04442295", "CTG-NCT04740476", "CTG-NCT06872125"]

