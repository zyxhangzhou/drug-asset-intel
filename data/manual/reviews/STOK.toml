match_note = "zorevunersen 是针对 SCN1A 单倍剂量不足的反义寡核苷酸（ASO），属遗传病 RNA 药物；原文：\"an antisense oligonucleotide designed to up-regulate NaV1.1 sodium channels\"（MAN-STOK-3）、\"Zorevunersen is designed to upregulate Na v 1.1 protein expression by leveraging the non-mutant (wild-type) copy of the SCN1A gene\"（MAN-STOK-1）。它对应 Novartis 第 3 治疗领域画像中的「遗传药物」，以及技术偏好行「xRNA/siRNA及递送」中的「可重复给药」（鞘内给药，维持期每 4 个月一次：\"Patients in these studies receive maintenance dosing of zorevunersen every 4 months (45mg)\"，MAN-STOK-1）。但画像限定为「神经退行性疾病」，Dravet 综合征是发育性癫痫性脑病：\"Dravet syndrome is a severe developmental and epileptic encephalopathy\"（MAN-STOK-1），不是神经退行性疾病，故不按「具体需求条目」计 4 分。组合冲突：10-K 竞争段点名的 Dravet 在研公司为 \"Ionis Pharmaceuticals, Lundbeck, Xenon Pharmaceuticals and Harmony Biosciences\" 及 Encoded Therapeutics，未出现 Novartis（MAN-STOK-1）；未见 Novartis 同机制同适应症资产。"
thesis = [
  "Novartis 需要「神经退行性疾病遗传药物」及「xRNA/siRNA及递送……可重复给药平台，配套临床资产更佳」；Stoke 的 zorevunersen（上调 NaV1.1 的 SCN1A 反义寡核苷酸，Dravet 综合征，3 期）对应这一需求，因为它是针对遗传病因的鞘内 RNA 药物、维持期每 4 个月给药一次，且已在关键 3 期中；但 Dravet 属发育性癫痫性脑病而非神经退行性疾病，对应度为中。",
  "证据是 1/2a 期开放标签研究及其延伸研究（NEJM 2026）：70 mg 组在延伸期前 20 个月惊厥发作频率中位变化 -58.82% 至 -90.91%，无对照组，与自然史队列的倾向评分比较属跨试验比较；下一事件是 3 期 EMPEROR 主要分析读出（2027 年第 3 季度，明确披露），随后 2027 年下半年提交 NDA；主要障碍是权益：美国、加拿大、墨西哥以外权益已独家许可给 Biogen，且双方共同开发、开发费用 70/30 分摊，全资收购须连同 Biogen 合作一并承接，故推荐北美区域许可。",
]
