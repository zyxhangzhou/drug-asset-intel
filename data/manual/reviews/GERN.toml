note = "10-K 原文：\"We have no material license agreements. We have global rights to imetelstat, which was discovered and developed at Geron.\"；\"RYTELO, which was developed internally and is exclusively owned by Geron\"；与 Janssen 的原合作 2018 年终止，原文\"without any economic obligations to Janssen with respect to such license\"（MAN-GERN-1）。义务：Royalty Pharma 按美国 RYTELO 净销售收取 7.75% / 3.0% / 1.0% 分级分成，上限 1.65 倍（2031-06-30 前）或 2.0 倍 1.25 亿美元；控制权变更时可一次性清偿（原文\"may be discharged in connection with a change of control of Geron\"）；该协议含\"restrictions on intellectual property transfers and out-licenses\"，不利于许可交易。Pharmakon 定期贷款 1.25 亿美元 2029-11-01 到期（SEC-0000886744-26-000037）。欧盟：公司\"do not plan to commercialize RYTELO independently in the EU\"，计划找第三方，10-Q 未披露已签协议（SEC-0000886744-26-000037）。待核实：10-Q 提到\"certain in-license agreements that require us to pay milestones\"，与 10-K\"no material license agreements\"的关系。"
