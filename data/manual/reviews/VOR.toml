match_note = "telitacicept 是 TACI-Fc 融合蛋白，同时抑制 BAFF（BLyS）与 APRIL，作用是减少自身反应性 B 细胞和自身抗体的产生，对应 J&J 画像中的「自身抗体清除」；适应症全身型重症肌无力（gMG）是自身抗体介导的慢性自身免疫病。原文：\"This dual-target mechanism reduces autoreactive B cells and autoantibody production\"（MAN-VOR-1）；\"constructed with the extracellular domain of the human transmembrane activator and calcium modulator and cyclophilin ligand interactor\"、\"resulting from pathogenic autoantibodies\"（SEC-0001193125-26-130451）。机制差异：画像点名的是 FcRn（加速 IgG 清除），telitacicept 作用在上游（减少抗体产生），不是同机制。组合重叠：10-K 竞争段列出 J&J 已有 gMG 产品 \"Johnson & Johnson (Imaavy/Myasthenia Gravis)\"（SEC-0001193125-26-130451），为同适应症、不同机制（FcRn），不构成 §3.1 组合冲突，但会与 Imaavy 形成同适应症竞争/互补关系；未核查 J&J 早期管线中是否有 BAFF/APRIL 资产。"
thesis = [
  "Johnson & Johnson 需要「FcRn、IL-23、自身抗体清除和慢性炎症疾病的长效生物药」；Vor Bio 的 telitacicept（TACI-Fc 融合蛋白、BAFF/APRIL 双靶抑制剂，全身型重症肌无力，全球 3 期进行中）对应这一需求，因为它通过抑制 BAFF/APRIL 减少自身反应性 B 细胞和自身抗体的产生，作用在 J&J 已上市 FcRn 抗体 Imaavy 的上游，且同一分子已在中国获批 gMG、SLE、RA、干燥病和 IgA 肾病等多个适应症。",
  "证据是中国随机双盲安慰剂对照 3 期（n=114，RemeGen 主导）达到主要终点，24 周 MG-ADL 较安慰剂改善 4.8 分，相对已上市药物的优势只有跨试验比较；下一事件是全球 3 期 gMG 顶线数据（2027 年上半年，明确披露）；主要障碍是权益与成本结构：大中华区权益归 RemeGen，公司须向 RemeGen 支付至多 3.3 亿美元监管里程碑、37.75 亿美元销售里程碑和高个位数至十几百分比的分级特许权使用费，且 FDA 是否接受中国数据不确定。",
]
thesis_sources = ["JNJ-1", "JNJ-3", "MAN-VOR-1", "MAN-VOR-2", "SEC-0001193125-26-130451", "SEC-0001193125-26-343607", "CTG-NCT06456580"]

