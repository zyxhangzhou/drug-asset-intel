[rights]
status = "partial"
note = "事实（10-Q 附注 10）：公司从 RemeGen 引进大中华区以外的独家权益，大中华区（中国大陆、香港、澳门、台湾）权益仍归 RemeGen：\"granting the Company exclusive rights to develop and commercialize RemeGen’s proprietary fusion protein compound, telitacicept (the “Licensed Compound”), outside of the People’s Republic of China, Hong Kong, Macau and Taiwan\"、\"RemeGen retains all rights to the Licensed Compound in Greater China.\"；许可区域内对 RemeGen 也排他、可再许可：\"exclusive (even as to RemeGen) license\"、\"with the right to grant sublicenses\"。设有对等人数的联合指导委员会，但区域内最终决定权归公司：\"final decision-making authority as it relates to the development and commercialization of the Licensed Compound outside Greater China lies with the Company\"。10-Q 与 10-K 未检索到选择权、优先谈判权、共同商业化或利润分成条款。引进义务：\"up to $ 330 million in regulatory milestone payments and up to $ 3.775 billion in sales milestone payments\"、\"ranging from high single digit to mid-teen percentages of net sales\"；若在特定开发事件前对外再许可或出售权益（控制权变更除外），RemeGen 分取个位数比例收益：\"RemeGen is entitled to receive a single digit percentage of certain net proceeds from such transactions\"——全资收购不触发该条款，故交易形式取收购。终止时区域权益回归 RemeGen：\"all rights and licenses in the terminated region will revert to RemeGen\"。债务：资产负债表未见借款，非流动负债为经营租赁与认股权证负债（\"Warrant liabilities\" 653,894 千美元，非债务），总负债 681,250 千美元。资金指引：\"we expect that our cash, cash equivalents and marketable securities will enable us to fund our operating expenses and capital expenditure requirements into early 2029\"（均见 SEC-0001193125-26-343607）。"
sources = ["SEC-0001193125-26-343607", "SEC-0001193125-26-130451"]
