[clinical]
design = "RemeGen 在中国完成的随机、双盲、安慰剂对照 3 期：114 例 gMG 患者 1:1 随机接受每周皮下 telitacicept 240 mg 或安慰剂 24 周（Part A），之后全部进入开放标签期（Part B）再用 24 周；原文：\"The trial enrolled 114 patients and consisted of a double-blind treatment period\"、\"patients were randomized 1:1 to receive either subcutaneous telitacicept 240 mg or placebo once a week for 24 doses\"、\"The primary endpoint of the trial was change from baseline in the Myasthenia Gravis Activities of Daily Living\"（SEC-0001193125-26-130451）。全球 3 期（NCT06456580）设计相同的主要终点：\"The primary endpoint is change from baseline in MG-ADL at week 24.\"（SEC-0001193125-26-130451）。"
comparability = "试验内对照为安慰剂，不是与标准治疗直接比较。公司把安慰剂校正 MG-ADL 与 efgartigimod、nipocalimab、rozanolixizumab 等关键试验并列，属跨试验比较，人群与终点定义可能不同：\"Based on historical clinical data; not a head-to-head trial\"（MAN-VOR-2）。中国单一国家人群，能否外推到美欧人群未知。"
result = "主要终点：24 周 MG-ADL 较安慰剂改善 4.8 分：\"a 4.8-point improvement in MG-ADL\"（MAN-VOR-1）；公司称统计学显著：\"Statistically significant and clinically meaningful improvement in MG-ADL score\"（MAN-VOR-2）。48 周开放标签期：\"Patients on telitacicept throughout the trial achieved a -7.5 mean MG-ADL change from baseline, while placebo crossover patients achieved -6.3\"、\"Patients on telitacicept throughout the trial achieved a -9.8 mean QMG change\"（SEC-0001193125-26-130451）。安全性：\"No new safety signals were observed.\"（SEC-0001193125-26-130451）。"
limitation = "p 值、置信区间、各组绝对变化值未在已打开的文件中找到（待核实）；未找到该 3 期的同行评议全文（PubMed 检索只见 2 期与真实世界研究）。48 周开放标签数据为描述性分析：\"The efficacy analysis was based on descriptive statistical analysis of the actual data in the full analysis set (FAS), and missing data were not filled.\"（MAN-VOR-3）。中国数据能否被 FDA 接受不确定：\"there is no assurance that the clinical data from any such trials will be accepted or considered by the FDA\"（SEC-0001193125-26-343607）。"
sources = ["SEC-0001193125-26-130451", "SEC-0001193125-26-343607", "MAN-VOR-1", "MAN-VOR-2", "MAN-VOR-3"]

