[clinical]
design = "开放标签、剂量探索与剂量扩展 1/2 期（NCT06389877）：A 部分为 AATD 肺病患者，B 部分为轻中度 AATD 肝病患者；截至 2026-02-10 共 29 例给药，随访最长 18 个月。原文：\"We are conducting a Phase 1/2 open label, dose exploration and dose expansion clinical trial of BEAM-302\"、\"29 patients had been treated with BEAM-302\"（SEC-0001193125-26-331541）"
comparability = "单臂、无对照，与 AAT 静脉补充治疗或其他在研药物无直接比较；任何比较都是跨试验比较，人群与终点定义可能不同。终点为 AAT 生物标志物（替代终点），非临床结局。"
result = "60 mg 单剂稳态总 AAT 均值 16.1 µM（75 mg 为 14.4 µM），Z-AAT 降低 84%，M-AAT 占比 94%；B 部分肝病患者疗效与 A 部分相当。原文：\"was 16.1 µM in the 60 mg cohort\"、\"The steady-state mean reduction in Z-AAT was 84% in the 60 mg cohort\"、\"The steady-state mean proportion of M-AAT was 94% in the 60 mg cohort\"（SEC-0001193125-26-331541）"
limitation = "早期、小样本、单臂，替代终点；单剂安全性良好（\"no serious AEs reported and no dose-limiting toxicities as of the data cutoff\"），但两次给药队列中 \"one patient had Grade 4 ALT and Grade 3 AST elevations\"（SEC-0001193125-26-331541）。2026 年 9 月 ERS 更新数据未能打开原文（公司 IR 页面拒绝访问），本表数据截止 2026-02-10。"
sources = ["SEC-0001193125-26-331541", "CTG-NCT06389877"]

