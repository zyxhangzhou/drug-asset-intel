thesis = [
  "AstraZeneca 需要「基因疗法、体内细胞疗法、补体/酶替代和遗传性疾病药物」；Beam 的 BEAM-302（肝靶向 LNP 递送的体内碱基编辑、一次性纠正 SERPINA1 E342K 突变，α1-抗胰蛋白酶缺乏症 AATD，1/2 期试验已开始关键性扩展队列）对应这一需求，因为它是针对遗传病的体内基因编辑疗法，且是公司自己推进注册开发的主导遗传病项目。",
  "证据是开放标签、单臂 1/2 期剂量探索数据：60 mg 单剂稳态总 AAT 均值 16.1 µM、突变 Z-AAT 降低 84%、校正后 M-AAT 占 94%，属替代指标，无对照、无与标准治疗的比较，未找到有来源的保护阈值；下一事件是关键性扩展队列（约 50 例 AATD 肺病患者，以 12 个月 AAT 生物标志物为主要终点，拟走加速批准）的主要终点数据（2028-05，CT.gov 估算）；主要障碍是 Sixth Street 有担保信贷：以含知识产权在内的几乎全部资产作第一顺位担保，控制权变更构成违约事件，收购时需一并处理。"
]
