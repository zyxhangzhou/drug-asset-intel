[rights]
status = "full"
note = "10-K/10-Q 没有写明 BEAM-302 为公司全资资产的原句；判断依据是合作披露中没有任何协议涉及 BEAM-302 或 AATD（Pfizer、Apellis、Verve/Lilly、Orbital/BMS、Prime），且由公司自己开展试验，而 Pfizer 获许可的候选物由 Pfizer 负责全部开发（\"granting Pfizer an exclusive, worldwide license to a liver-targeted development candidate\"、\"Pfizer is responsible for all development activities\"，SEC-0001193125-26-331541），该候选物靶点未披露，置信度中。对许可方/第三方的义务：与某研究机构的和解协议对 BEAM-302 有里程碑与销售分成，原文 \"make additional payments contingent upon the development and commercialization of BEAM-102 and BEAM-302\"、\"1 % royalty on net sales through 2038\"（SEC-0001193125-26-331541）；Editas 许可需转付上游特许权使用费并另付 \"low- to mid-single digit royalty on net sales of licensed products\"（MAN-BEAM-1，是否覆盖 BEAM-302 待核实）；Harvard / Broad 按股价倍数触发的成功付款，原文 \"may owe Harvard success payments of up to an additional $ 90.0 million\"（SEC-0001193125-26-331541）。交易障碍（不改变权益状态）：Sixth Street 信贷 \"secured on a first-priority basis, subject to certain exceptions, by security interests in substantially all assets of the Company and its material subsidiaries, including its intellectual property\"，并限制 \"sales and licensing transactions with respect to its core intellectual property\"，违约事件含 \"change of control\"（SEC-0001193125-26-331541）。"
sources = ["SEC-0001193125-26-331541", "MAN-BEAM-1"]
