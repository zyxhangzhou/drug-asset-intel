[clinical]
design = "ALPHA3 关键性 2 期：随机、对照为观察，一线治疗后 MRD 阳性 LBCL，计划约 220 例，主要终点 EFS；中期无效性分析基于开放组的前 24 例（12 vs 12）；原文：\"first 24 patients randomized in the two study arms still open to enrollment\"，\"The study is powered to detect a 50% reduction in the risk of EFS events.\"（MAN-ALLO-1）"
comparability = "对照为观察，是该场景的现行处理；同场景没有获批疗法可比。10-K 认为自体 CAR-T 不适用于一线巩固（原文：\"We do not, however, believe that autologous CAR T therapy will be a viable option in the 1L consolidation setting\"，SEC-0001628280-26-017242），这是公司观点。MRD 清除差异能否转化为 EFS 获益，公司只引用文献与跨研究基准（原文：\"Published literature and cross-study benchmarks suggest\"，MAN-ALLO-2），属跨试验推断，人群与终点定义可能不同。"
result = "MRD 转阴 58.3% 对 16.7%，绝对差 41.6%（原文：\"This represents a 41.6% absolute difference in MRD clearance between the two arms\"，MAN-ALLO-1）；Day 45 ctDNA 中位下降 97.7%（原文：\"decreased from baseline by a median of 97.7% in the cema-cel arm\"，MAN-ALLO-1）。安全性：无 CRS、ICANS、GvHD（原文：\"There were no cases of cytokine release syndrome\"，MAN-ALLO-1），12 例中 10 例全程门诊（原文：\"Ten of 12 patients who received cema-cel were managed entirely outpatient post-infusion\"，MAN-ALLO-1）。FDA 授予 RMAT 与 Fast Track（原文：\"granted Regenerative Medicine Advanced Therapy (RMAT) and Fast Track designations\"，MAN-ALLO-2）。"
limitation = "中期分析、样本小（每组 12 例）、替代终点；主要终点 EFS 未揭盲（MAN-ALLO-1）。基线不平衡，公司自述\"a numerically greater number of patients in the cema-cel arm had more aggressive disease features\"（MAN-ALLO-1）。入组依赖 Natera 的 CLARITY MRD 检测，商业化受检测可及性与报销影响（原文：\"the commercial success of cema-cel will depend in part on the assay’s commercial availability\"，SEC-0001628280-26-056213）。"
sources = ["MAN-ALLO-1", "MAN-ALLO-2", "SEC-0001628280-26-017242", "SEC-0001628280-26-056213"]

