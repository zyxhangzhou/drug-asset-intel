[rights]
status = "partial"
note = "cema-cel 为转授权引进资产，Allogene 不持有全球权益。10-Q 原文：\"expanded our territory under the Original Servier Agreement to include the European Union and the United Kingdom, and provided for an option to further expand our territory to include China and Japan\"，并\"waived certain of our rights to elect to convert certain of our license rights to a worldwide license\"（SEC-0001628280-26-056213）；Q2 新闻稿原文：\"Servier has granted Allogene exclusive rights to cema-cel in the U.S., all EU Member States and the United Kingdom.\"（MAN-ALLO-2）。推断：文件只写 Allogene 的许可区域；其余地区（含中国、日本，Allogene 仅有扩展选择权）的权利按许可方推断仍在 Servier。上游：Servier 的权利来自 Cellectis（10-K 原文：\"We also rely on Cellectis, through our agreement with Servier, for exclusive rights to cema-cel.\"，SEC-0001628280-26-017242）；2025-12 仲裁\"affirmed continued licensing rights relating to cema-cel\"；2026-04 LTC（Thermo Fisher 子公司）声称终止与 Cellectis 的 TALEN 许可，10-Q 原文\"could also affect the Company’s rights with respect to CD19 Products\"（SEC-0001628280-26-056213）。对许可方的义务：Servier 美国提成\"low tens to the mid teen percentages and the ex-U.S. royalty rate is 10 %\"；首个适应症里程碑\"€ 60.0 million remains for the initial indication for cema-cel\"，另有后续适应症与销售里程碑；Pfizer 资产转让协议下另有里程碑与提成（原文：\"pay royalties on certain net sales pursuant to the Pfizer Agreement\"）（SEC-0001628280-26-056213）。债务：10-Q 未列票据或贷款；CIRM 资助只在公司选择时可转为贷款（原文：\"the right, upon its election, to convert the award into a loan\"，SEC-0001628280-26-056213）。10-Q 未披露控制权变更时需许可方同意的条款。"
sources = ["SEC-0001628280-26-056213", "SEC-0001628280-26-017242", "MAN-ALLO-2"]
